<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fc"><meta name="description" content="Play Simon Says, a free browser memory game. Watch the color sequence and repeat it to reach a new high score."><meta name="robots" content="index,follow"><link rel="canonical" href="https://masoomdev.online/games/simon-says/"><title>Simon Says – Free Online Memory Game | MasoomDev</title><style>
:root{font:16px/1.6 system-ui,Segoe UI,sans-serif;color:#1d2b43;background:#f7f8fc}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dfe5ef;padding:15px max(20px,calc((100vw - 1050px)/2))}header a{color:#4335a1;font-weight:750;text-decoration:none}main{max-width:620px;margin:auto;padding:30px 16px 64px}h1{font-size:clamp(28px,5vw,42px)}p{color:#506079}article{background:#fff;border:1px solid #e0e6ef;border-radius:18px;padding:clamp(14px,4vw,24px);box-shadow:0 8px 28px #28364b0d}.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:750;background:#f0edfc;padding:10px 14px;border-radius:12px}.pads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:380px;margin:18px auto}.pad{aspect-ratio:1;border:0;border-radius:22px;margin:0;min-height:0;opacity:.7;transition:filter .12s,opacity .12s,transform .12s}.pad:active,.pad.lit{opacity:1;filter:brightness(1.35);transform:scale(.97)}.pad:disabled{cursor:not-allowed}.green{background:#18a876}.red{background:#e54b64}.yellow{background:#f4c54d}.blue{background:#5275eb}button{font:inherit;font-weight:700;cursor:pointer;background:#5942ba;border:0;border-radius:10px;color:#fff;padding:11px 18px;min-height:46px}.start{display:block;margin:auto}.status{text-align:center;min-height:28px;font-weight:700;color:#4f3aa1}button:focus-visible,a:focus-visible{outline:3px solid #987df0;outline-offset:3px}footer{text-align:center;padding:24px;border-top:1px solid #dce3ed;color:#63718a}footer a{color:#4335a1}@media(prefers-reduced-motion:reduce){.pad{transition:none}}
</style><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md-pwa.js" defer></script></head>
<body><header><a href="/games/">← All games</a></header><main><h1>Simon Says</h1><p>Watch the lights, then repeat the sequence in the same order. One new color is added each round.</p><article><div class="hud"><span id="round">Round: 0</span><span id="best">Best: 0</span></div><div class="pads" role="group" aria-label="Color pads"><button class="pad green" data-pad="0" aria-label="Green"></button><button class="pad red" data-pad="1" aria-label="Red"></button><button class="pad yellow" data-pad="2" aria-label="Yellow"></button><button class="pad blue" data-pad="3" aria-label="Blue"></button></div><p id="status" class="status" aria-live="polite">Press Start to play.</p><button class="start" id="start">Start game</button></article></main><footer><a href="/games/">More free games</a> · <a href="/">MasoomDev</a></footer>
<script>
(()=>{const pads=[...document.querySelectorAll('[data-pad]')],status=document.getElementById('status'),roundLabel=document.getElementById('round'),bestLabel=document.getElementById('best');let sequence=[],position=0,playing=false,accepting=false,round=0,timers=[];const key='md-simon-best';function best(){try{return Number(localStorage.getItem(key))||0}catch{return 0}}function setBest(n){try{localStorage.setItem(key,String(n))}catch{}}bestLabel.textContent='Best: '+best();function flash(i,duration=300){pads[i].classList.add('lit');timers.push(setTimeout(()=>pads[i].classList.remove('lit'),duration))}function playSequence(){accepting=false;status.textContent='Watch the sequence.';sequence.push(Math.floor(Math.random()*4));let i=0;const run=()=>{if(!playing)return;if(i>=sequence.length){accepting=true;position=0;status.textContent='Your turn. Repeat the sequence.';return}flash(sequence[i],320);i++;timers.push(setTimeout(run,620))};timers.push(setTimeout(run,500))}function end(){playing=false;accepting=false;status.textContent='Wrong sequence. You reached round '+round+'. Press Start to try again.';if(round>best()){setBest(round);bestLabel.textContent='Best: '+round}}function begin(){timers.forEach(clearTimeout);timers=[];sequence=[];round=0;playing=true;accepting=false;roundLabel.textContent='Round: 0';playSequence()}function choose(i){if(!accepting||!playing)return;flash(i,180);if(sequence[position]!==i){end();return}position++;if(position===sequence.length){round++;roundLabel.textContent='Round: '+round;accepting=false;timers.push(setTimeout(playSequence,700))}}pads.forEach(p=>p.addEventListener('click',()=>choose(Number(p.dataset.pad))));document.getElementById('start').onclick=begin})();
</script></body></html>
