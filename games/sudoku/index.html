<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fc"><meta name="description" content="Solve a quick free 4 by 4 Sudoku puzzle in your browser. Fill each row, column, and box with the numbers one to four."><meta name="robots" content="index,follow"><link rel="canonical" href="https://masoomdev.online/games/sudoku/"><title>Sudoku – Free Online Number Puzzle | MasoomDev</title><style>
:root{font:16px/1.6 system-ui,Segoe UI,sans-serif;color:#1d2b43;background:#f7f8fc}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dfe5ef;padding:15px max(20px,calc((100vw - 1050px)/2))}header a{color:#4335a1;font-weight:750;text-decoration:none}main{max-width:620px;margin:auto;padding:30px 16px 64px}h1{font-size:clamp(28px,5vw,42px)}p{color:#506079}article{background:#fff;border:1px solid #e0e6ef;border-radius:18px;padding:clamp(14px,4vw,24px);box-shadow:0 8px 28px #28364b0d}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:min(100%,360px);margin:16px auto;border:3px solid #46388c;border-radius:8px;overflow:hidden}.cell{width:100%;aspect-ratio:1;border:0;border-right:1px solid #d7d8e7;border-bottom:1px solid #d7d8e7;border-radius:0;margin:0;padding:0;background:#fff;color:#44339e;font-size:clamp(23px,7vw,38px);font-weight:750;text-align:center}.cell:nth-child(2n){border-right:3px solid #6c5ec0}.cell:nth-child(n+5):nth-child(-n+8){border-bottom:3px solid #6c5ec0}.cell:disabled{background:#efedfa;color:#26314b;opacity:1}.cell:focus{position:relative;z-index:1;outline:3px solid #987df0;outline-offset:-3px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{font:inherit;font-weight:700;cursor:pointer;background:#5942ba;border:0;border-radius:10px;color:#fff;padding:11px 18px;min-height:46px}button.secondary{background:#e9e6fa;color:#44339e}button:focus-visible,a:focus-visible{outline:3px solid #987df0;outline-offset:3px}.status{text-align:center;min-height:28px;font-weight:700;color:#4f3aa1}footer{text-align:center;padding:24px;border-top:1px solid #dce3ed;color:#63718a}footer a{color:#4335a1}
</style><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md-pwa.js" defer></script></head>
<body><header><a href="/games/">← All games</a></header><main><h1>Sudoku</h1><p>Fill each row, column, and 2×2 box with the numbers 1 to 4. This quick mini Sudoku is designed for a short break.</p><article><div id="board" class="board" role="group" aria-label="4 by 4 Sudoku board"></div><p id="status" class="status" aria-live="polite">Fill every empty square, then check your answers.</p><div class="actions"><button id="check">Check answers</button><button id="clear" class="secondary">Clear entries</button></div></article></main><footer><a href="/games/">More free games</a> · <a href="/">MasoomDev</a></footer>
<script>
(()=>{const puzzle=[[1,0,0,4],[0,4,1,0],[2,0,4,0],[0,3,0,1]],solution=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]],board=document.getElementById('board'),status=document.getElementById('status');const cells=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++){const input=document.createElement('input');input.className='cell';input.type='text';input.inputMode='numeric';input.maxLength=1;input.autocomplete='off';input.setAttribute('aria-label','Row '+(r+1)+', column '+(c+1));if(puzzle[r][c]){input.value=String(puzzle[r][c]);input.disabled=true}else input.addEventListener('input',()=>{input.value=input.value.replace(/[^1-4]/g,'').slice(0,1);status.textContent='Fill every empty square, then check your answers.'});cells.push({input,r,c});board.append(input)}document.getElementById('check').onclick=()=>{let empty=false,wrong=false;for(const {input,r,c} of cells){if(!input.value)empty=true;else if(Number(input.value)!==solution[r][c])wrong=true}status.textContent=wrong?'Some numbers are incorrect. Check each row, column, and box.':empty?'A few squares are still empty.':'Solved! Great work.'};document.getElementById('clear').onclick=()=>{cells.forEach(({input})=>input.value='');status.textContent='Entries cleared. Try again.'};board.addEventListener('keydown',e=>{const i=cells.findIndex(v=>v.input===e.target);if(i<0)return;let next=i;if(e.key==='ArrowRight')next=Math.min(cells.length-1,i+1);if(e.key==='ArrowLeft')next=Math.max(0,i-1);if(e.key==='ArrowDown')next=Math.min(cells.length-1,i+3);if(e.key==='ArrowUp')next=Math.max(0,i-3);if(next!==i){e.preventDefault();cells[next].input.focus()}})})();
</script></body></html>
