<style>
:root{font:16px/1.6 system-ui,Segoe UI,sans-serif;color:#1d2b43;background:#f7f8fc}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dfe5ef;padding:15px max(20px,calc((100vw - 1050px)/2))}header a{color:#4335a1;font-weight:750;text-decoration:none}main{max-width:760px;margin:auto;padding:32px 16px 64px}h1{font-size:clamp(28px,5vw,42px);line-height:1.2}p{color:#506079}article{background:#fff;border:1px solid #e0e6ef;border-radius:18px;padding:clamp(14px,4vw,24px);box-shadow:0 8px 28px #28364b0d}.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:750;background:#f0edfc;padding:10px 14px;border-radius:12px;margin-bottom:12px}canvas{display:block;width:100%;height:auto;max-width:600px;margin:auto;border-radius:12px;background:#111b3a;touch-action:none}button{font:inherit;font-weight:700;cursor:pointer;background:#5942ba;border:0;border-radius:10px;color:#fff;padding:11px 18px;min-height:44px;margin:10px 6px 0 0}button.secondary{background:#e9e6fa;color:#44339e}button:focus-visible,a:focus-visible{outline:3px solid #987df0;outline-offset:3px}.actions{text-align:center}.status{text-align:center;min-height:26px;font-weight:650;color:#4f3aa1}footer{text-align:center;padding:24px;border-top:1px solid #dce3ed;color:#63718a}footer a{color:#4335a1}@media(max-width:480px){main{padding-top:20px}.hud{font-size:14px}}

<body><header><a href="/games/">← All games</a></header><main><h1>Breakout</h1><p>Slide the paddle to bounce the ball and clear every brick. Use your mouse, touch, or the left and right arrow keys.</p><article><div class="hud"><span id="score">Score: 0</span><span id="lives">Lives: 3</span><span id="best">Best: 0</span></div><canvas id="board" width="600" height="420" aria-label="Breakout game board"></canvas><p id="status" class="status" aria-live="polite">Press Start to play.</p><div class="actions"><button id="start">Start game</button><button id="pause" class="secondary">Pause</button></div></article></main><footer><a href="/games/">More free games</a> · <a href="/">MasoomDev</a></footer>
<script>
(()=>{const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),bestEl=document.getElementById('best');let raf=0,running=false,score=0,lives=3,paddle={x:250,w:100},ball={x:300,y:350,dx:3,dy:-4,r:8},bricks=[];const colors=['#60d7d1','#6d91f2','#a67af2','#f28eb8','#ffbe73'];const getBest=()=>{try{return Number(localStorage.getItem('md-breakout-best'))||0}catch{return 0}};let best=getBest();bestEl.textContent='Best: '+best;function build(){bricks=[];for(let r=0;r<5;r++)for(let c=0;c<10;c++)bricks.push({x:15+c*57,y:46+r*27,w:50,h:17,on:true,color:colors[r]})}function draw(){ctx.clearRect(0,0,600,420);const grad=ctx.createLinearGradient(0,0,600,420);grad.addColorStop(0,'#172952');grad.addColorStop(1,'#11162f');ctx.fillStyle=grad;ctx.fillRect(0,0,600,420);bricks.forEach(b=>{if(!b.on)return;ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,5);ctx.fill()});ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowColor='#6de0ff';ctx.shadowBlur=16;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#b7a1ff';ctx.beginPath();ctx.roundRect(paddle.x,386,paddle.w,13,7);ctx.fill()}function finish(message){running=false;cancelAnimationFrame(raf);status.textContent=message+' Final score: '+score+'. Press Start to play again.'}function tick(){if(!running)return;ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x<ball.r||ball.x>600-ball.r)ball.dx*=-1;if(ball.y<ball.r)ball.dy=Math.abs(ball.dy);if(ball.y+ball.r>=386&&ball.y<400&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){ball.dy=-Math.abs(ball.dy);ball.dx+=((ball.x-(paddle.x+paddle.w/2))/(paddle.w/2))*1.2}for(const b of bricks){if(b.on&&ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.on=false;ball.dy*=-1;score+=10;scoreEl.textContent='Score: '+score;if(score>best){best=score;bestEl.textContent='Best: '+best;try{localStorage.setItem('md-breakout-best',String(best))}catch{}}break}}if(ball.y>430){lives--;livesEl.textContent='Lives: '+lives;if(!lives){draw();finish('Game over.');return}ball={x:300,y:350,dx:3,dy:-4,r:8};running=false;status.textContent='Ball lost. Press Start to continue.';draw();return}if(bricks.every(b=>!b.on)){draw();finish('You cleared every brick!');return}draw();raf=requestAnimationFrame(tick)}function start(){if(running)return;if(!bricks.length||bricks.every(b=>!b.on)||lives===0){score=0;lives=3;scoreEl.textContent='Score: 0';livesEl.textContent='Lives: 3';ball={x:300,y:350,dx:3,dy:-4,r:8};build()}running=true;status.textContent='Game on!';raf=requestAnimationFrame(tick)}function move(x){const rect=canvas.getBoundingClientRect();paddle.x=Math.max(0,Math.min(600-paddle.w,(x-rect.left)*600/rect.width-paddle.w/2));if(!running)draw()}canvas.addEventListener('pointermove',e=>move(e.clientX));canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);move(e.clientX)});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();paddle.x=Math.max(0,Math.min(600-paddle.w,paddle.x+(e.key==='ArrowLeft'?-34:34)));if(!running)draw()}});document.getElementById('start').onclick=start;document.getElementById('pause').onclick=()=>{if(running){running=false;cancelAnimationFrame(raf);status.textContent='Paused. Press Start to continue.'}};build();draw()})();
</script></body></html>
