<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5 Mini Games | MasoomDev</title><style>body{margin:0;background:#f7f6fc;color:#29213c;font:16px system-ui}main{max-width:950px;margin:auto;padding:25px 16px 90px}a{color:#5c37ad}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{background:#ece6fb;color:#4a3280}.tabs button[aria-selected=true]{background:#6540bd;color:white}button{font:inherit;cursor:pointer;border:1px solid #bfa9e4;border-radius:10px;padding:11px 15px;margin:3px;background:#6540bd;color:white;touch-action:manipulation}.game{display:none;background:white;border:1px solid #e0d7ed;border-radius:16px;padding:22px;min-height:300px}.game.active{display:block}.status{padding:12px;border-radius:9px;background:#f2edfc;min-height:22px;margin:15px 0}input{padding:10px;border:1px solid #bfa9e4;border-radius:9px;font:inherit;max-width:100%}.board{display:grid;grid-template-columns:repeat(3,75px);gap:6px;margin:18px auto;width:max-content}.board button{height:75px;font-size:25px;margin:0;padding:0}.letters{display:flex;flex-wrap:wrap;gap:4px}.letters button{padding:8px 10px}.letters button:disabled{opacity:.35}.choice{font-size:25px}.number{font-size:32px;letter-spacing:4px;font-weight:800}.hidden{display:none!important}</style><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md-pwa.js" defer></script></head><body><main><a href="/games/">← All games</a><h1>5 Mini Games</h1><p>Quick games with local high scores. Works on desktop and mobile.</p><div class="tabs" role="tablist" id="tabs"></div><div id="games"></div></main><script>
const names=['Number Memory','Reaction Challenge','Word Guess','Rock Paper Scissors','Sliding Puzzle'];const games=document.getElementById('games'),tabs=document.getElementById('tabs');const sections=names.map((n,i)=>{const b=document.createElement('button');b.textContent=n;b.setAttribute('role','tab');b.onclick=()=>choose(i);tabs.append(b);const s=document.createElement('section');s.className='game';s.innerHTML='<h2>'+n+'</h2>';const status=document.createElement('div');status.className='status';status.setAttribute('aria-live','polite');s.append(status);games.append(s);return {s,b,status}});function choose(i){sections.forEach((g,j)=>{g.s.classList.toggle('active',i===j);g.b.setAttribute('aria-selected',String(i===j))})}function el(tag,text,parent){const e=document.createElement(tag);if(text!=null)e.textContent=text;parent.append(e);return e}function button(text,parent,fn){const b=el('button',text,parent);b.onclick=fn;return b}function best(k,score){try{const old=Number(localStorage.getItem('md-mini-'+k))||0;if(score>old)localStorage.setItem('md-mini-'+k,score);return Math.max(score,old)}catch{return score}}
{const {s,status}=sections[0];let value='',level=3,timeout;const shown=el('p','',s);shown.className='number';const input=el('input','',s);input.inputMode='numeric';input.placeholder='Enter remembered number';input.className='hidden';const check=button('Check',s,()=>{if(input.value===value){status.textContent='Correct! Level '+level+'. Best: '+best('memory',level);level++}else{status.textContent='Incorrect. The number was '+value+'. Best: '+best('memory',level-1);level=3}input.classList.add('hidden');shown.textContent='';start.disabled=false});check.classList.add('hidden');const start=button('Show number',s,()=>{start.disabled=true;check.classList.add('hidden');input.classList.add('hidden');input.value='';value=Array.from({length:level},()=>Math.floor(Math.random()*10)).join('');shown.textContent=value;status.textContent='Memorize the number';clearTimeout(timeout);timeout=setTimeout(()=>{shown.textContent='••••';input.classList.remove('hidden');check.classList.remove('hidden');input.focus()},Math.max(1300,level*650))});}
{const {s,status}=sections[1];let state='idle',timer,startAt;const pad=button('Start reaction test',s,()=>{if(state==='waiting'){clearTimeout(timer);state='idle';status.textContent='Too early! Try again.';pad.textContent='Try again';pad.style.background='';return}if(state==='ready'){const ms=Math.round(performance.now()-startAt);status.textContent=ms+' ms reaction time. Best: '+best('reaction',10000-ms)+' points';state='idle';pad.textContent='Play again';pad.style.background='';return}state='waiting';pad.textContent='Wait for green…';pad.style.background='#b94a58';status.textContent='Do not click yet';timer=setTimeout(()=>{state='ready';startAt=performance.now();pad.textContent='CLICK NOW!';pad.style.background='#16804f'},1200+Math.random()*3000)});}
{const {s,status}=sections[2];const words=['PLANET','PURPLE','PUZZLE','BROWSER','GARDEN','ROCKET','WINDOW','BUTTON','PYTHON','GALAXY'];let word='',used=new Set(),lives=6;const display=el('p','',s);display.className='number';const letters=el('div','',s);letters.className='letters';function draw(){display.textContent=word.split('').map(c=>used.has(c)?c:'_').join(' ');const win=[...word].every(c=>used.has(c));status.textContent=win?'You win!':lives<=0?'Game over! Word: '+word:'Wrong guesses left: '+lives;letters.querySelectorAll('button').forEach(b=>b.disabled=used.has(b.textContent)||win||lives<=0)}function reset(){word=words[Math.floor(Math.random()*words.length)];used=new Set();lives=6;draw()}for(const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ')button(c,letters,()=>{if(used.has(c))return;used.add(c);if(!word.includes(c))lives--;draw()});button('New word',s,reset);reset();}
{const {s,status}=sections[3];let wins=0,losses=0;const choices=['Rock','Paper','Scissors'];choices.forEach((c,i)=>button(['✊ ','✋ ','✌️ '][i]+c,s,()=>{const j=Math.floor(Math.random()*3),out=i===j?'Draw':(i-j+3)%3===1?'You win':'Computer wins';if(out==='You win')wins++;if(out==='Computer wins')losses++;status.textContent='You: '+c+' | Computer: '+choices[j]+' — '+out+' | W '+wins+' / L '+losses+' | Best wins: '+best('rps',wins)}));status.textContent='Choose your move.';}
{const {s,status}=sections[4];let tiles=[1,2,3,4,5,6,7,8,0],moves=0;const board=el('div','',s);board.className='board';function render(){board.replaceChildren();tiles.forEach((v,i)=>{const b=button(v||' ',board,()=>{const z=tiles.indexOf(0);if(Math.abs(Math.floor(i/3)-Math.floor(z/3))+Math.abs(i%3-z%3)!==1)return;[tiles[i],tiles[z]]=[tiles[z],tiles[i]];moves++;render();if(tiles.every((x,j)=>x===(j+1)%9))status.textContent='Solved in '+moves+' moves!'});if(!v){b.style.visibility='hidden'}});if(!status.textContent)status.textContent='Arrange numbers 1–8 in order.'}button('Shuffle',s,()=>{tiles=[1,2,3,4,5,6,7,8,0];moves=0;for(let n=0;n<120;n++){const z=tiles.indexOf(0),options=[z-3,z+3,z%3?z-1:-1,z%3<2?z+1:-1].filter(x=>x>=0&&x<9);const j=options[Math.floor(Math.random()*options.length)];[tiles[z],tiles[j]]=[tiles[j],tiles[z]]}status.textContent='Solve the puzzle';render()});render();}
choose(0);
</script><script src="/games/sound-effects.js" defer></script></body></html>
