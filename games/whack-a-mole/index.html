:root{font:16px/1.6 system-ui,Segoe UI,sans-serif;color:#1d2b43;background:#f7f8fc}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dfe5ef;padding:15px max(20px,calc((100vw - 1050px)/2))}header a{color:#4335a1;font-weight:750;text-decoration:none}main{max-width:650px;margin:auto;padding:32px 16px 64px}h1{font-size:clamp(28px,5vw,42px);line-height:1.2}p{color:#506079}article{background:#fff;border:1px solid #e0e6ef;border-radius:18px;padding:clamp(14px,4vw,24px);box-shadow:0 8px 28px #28364b0d}.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:750;background:#f0edfc;padding:10px 14px;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2.5vw,15px);max-width:440px;margin:17px auto}.hole{aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(ellipse at center,#63452e 0 49%,#9b704c 51% 59%,#d9c2a0 61% 100%);font-size:clamp(26px,10vw,52px);padding:0;margin:0;min-height:0;cursor:pointer}.hole:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #987df0;outline-offset:3px}.hole:not(.up){color:transparent}.hole.up{animation:pop .12s ease-out}.hole:disabled{cursor:default}@keyframes pop{from{transform:scale(.75)}to{transform:scale(1)}}button.start{font:inherit;font-weight:700;cursor:pointer;background:#5942ba;border:0;border-radius:10px;color:#fff;padding:11px 20px;min-height:46px}.actions{text-align:center}.status{text-align:center;min-height:27px;font-weight:650;color:#4f3aa1}footer{text-align:center;padding:24px;border-top:1px solid #dce3ed;color:#63718a}footer a{color:#4335a1}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md-pwa.js" defer></script></head>
<body><header><a href="/games/">← All games</a></header><main><h1>Whack-a-Mole</h1><p>Tap the mole as it pops up. Score as many hits as you can before the 30-second timer runs out.</p><article><div class="hud"><span id="score">Score: 0</span><span id="time">Time: 30s</span><span id="best">Best: 0</span></div><div id="board" class="grid" role="group" aria-label="Whack-a-Mole game board"></div><p id="status" class="status" aria-live="polite">Press Start, then tap the mole.</p><div class="actions"><button class="start" id="start">Start game</button></div></article></main><footer><a href="/games/">More free games</a> · <a href="/">MasoomDev</a></footer>
<script>
(()=>{const board=document.getElementById('board'),status=document.getElementById('status'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best');let active=-1,score=0,seconds=30,playing=false,tick,hop;const bestKey='md-whack-a-mole-best';function best(){try{return Number(localStorage.getItem(bestKey))||0}catch{return 0}}function showBest(){bestEl.textContent='Best: '+best()}function makeBoard(){board.replaceChildren();for(let i=0;i<9;i++){const b=document.createElement('button');b.type='button';b.className='hole';b.setAttribute('aria-label','Hole '+(i+1));b.onclick=()=>{if(playing&&i===active){score++;scoreEl.textContent='Score: '+score;active=-1;render();pop()}};board.append(b)}}function render(){[...board.children].forEach((b,i)=>{const up=i===active;b.classList.toggle('up',up);b.textContent=up?'🐹':'';b.setAttribute('aria-label',up?'Mole! Hit it':'Empty hole '+(i+1));b.disabled=!playing||!up})}function pop(){if(!playing)return;let n=Math.floor(Math.random()*9);if(n===active)n=(n+1+Math.floor(Math.random()*8))%9;active=n;render()}function end(){playing=false;clearInterval(tick);clearInterval(hop);active=-1;render();try{if(score>best())localStorage.setItem(bestKey,String(score))}catch{}showBest();status.textContent='Time! You scored '+score+'. Press Start to play again.'}function start(){clearInterval(tick);clearInterval(hop);score=0;seconds=30;playing=true;scoreEl.textContent='Score: 0';timeEl.textContent='Time: 30s';status.textContent='Go! Catch the mole.';pop();hop=setInterval(pop,780);tick=setInterval(()=>{seconds--;timeEl.textContent='Time: '+seconds+'s';if(seconds<=0)end()},1000)}document.getElementById('start').onclick=start;makeBoard();showBest()})();
</script></body></html>
