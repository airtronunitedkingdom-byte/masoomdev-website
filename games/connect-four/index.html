<body><header><a href="/games/">← All games</a></header><main><h1>Connect Four</h1><p>Take turns dropping discs into the board. Connect four horizontally, vertically or diagonally to win.</p><article><p id="status" class="status" aria-live="polite">Red goes first. Pick a column.</p><div id="board" role="group" aria-label="Connect Four board"></div><div class="actions"><button id="reset">New game</button></div></article></main><footer><a href="/games/">More free games</a> · <a href="/">MasoomDev</a></footer>
<script>
(()=>{const board=document.getElementById('board'),status=document.getElementById('status');let grid,turn,done;function reset(){grid=Array.from({length:6},()=>Array(7).fill(0));turn=1;done=false;status.textContent='Red goes first. Pick a column.';render()}function won(r,c,p){for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let total=1;for(const sign of [-1,1]){let y=r+dr*sign,x=c+dc*sign;while(y>=0&&y<6&&x>=0&&x<7&&grid[y][x]===p){total++;y+=dr*sign;x+=dc*sign}}if(total>=4)return true}return false}function play(c){if(done)return;let r=5;while(r>=0&&grid[r][c])r--;if(r<0)return;grid[r][c]=turn;if(won(r,c,turn)){done=true;status.textContent=(turn===1?'Red':'Yellow')+' wins! Start a new game to play again.'}else if(grid[0].every(Boolean)){done=true;status.textContent='It is a draw. Start a new game to play again.'}else{turn=3-turn;status.textContent=(turn===1?'Red':'Yellow')+' to play. Choose a column.'}render()}function render(){board.replaceChildren();for(let r=0;r<6;r++)for(let c=0;c<7;c++){const b=document.createElement('button');b.type='button';b.className='cell'+(grid[r][c]===1?' red':grid[r][c]===2?' yellow':'');b.setAttribute('aria-label','Row '+(r+1)+', column '+(c+1)+': '+(grid[r][c]===1?'red':grid[r][c]===2?'yellow':'empty'));b.disabled=done||!!grid[0][c];b.onclick=()=>play(c);board.append(b)}}document.getElementById('reset').onclick=reset;reset()})();
</script></body></html>
