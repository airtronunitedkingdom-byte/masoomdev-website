<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Rotate or flip JPG, PNG and WebP images."><title>Image Rotator & Flipper | MasoomDev</title><link rel="stylesheet" href="/assets/tool-shared.css"><link rel="manifest" href="/manifest.webmanifest"><style>canvas{max-width:100%;height:auto;border:1px solid #b9adcb;border-radius:9px;touch-action:none}.hint{font-size:.9rem;color:#736586}</style></head><body><header><a href="/tools/image-tools/">← Image Tools</a></header><main><h1>Image Rotator & Flipper</h1><p>Rotate or flip JPG, PNG and WebP images. Processing stays on your device.</p><section class="panel"><div class="controls"><label class="field">Image<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><label class="field">Rotation<select id="angle"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label><label class="field">Flip<select id="flip"><option value="none">None</option><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option></select></label><label class="field">Format<select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></label><button id="run" disabled>Apply changes</button></div><p id="status" role="status"></p></section><section class="panel" id="result" hidden><canvas id="canvas" width="1" height="1"></canvas><p id="info"></p><button id="save">Download image</button></section></main><footer>MasoomDev • Free browser tools</footer><script src="/assets/tool-shared.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id);let img,blob;$('file').addEventListener('change',async()=>{img=null;$('run').disabled=true;$('result').hidden=true;try{img=await MDTools.loadImage($('file').files[0]);if(img.naturalWidth*img.naturalHeight>40000000)throw Error('Maximum 40 megapixels');$('run').disabled=false;$('status').textContent='Image loaded.'}catch(e){$('status').textContent=e.message}});$('run').addEventListener('click',async()=>{if(!img)return;try{const angle=Number($('angle').value),swapped=angle%180!==0,c=$('canvas');c.width=swapped?img.naturalHeight:img.naturalWidth;c.height=swapped?img.naturalWidth:img.naturalHeight;const ctx=c.getContext('2d');if($('format').value==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height)}ctx.translate(c.width/2,c.height/2);ctx.rotate(angle*Math.PI/180);ctx.scale($('flip').value==='horizontal'?-1:1,$('flip').value==='vertical'?-1:1);ctx.drawImage(img,-img.naturalWidth/2,-img.naturalHeight/2);blob=await MDTools.canvasBlob(c,$('format').value,.92);$('result').hidden=false;$('info').textContent=c.width+' × '+c.height+' • '+MDTools.formatBytes(blob.size);$('status').textContent='Ready.'}catch(e){$('status').textContent=e.message}});$('save').addEventListener('click',()=>{if(blob)MDTools.download(blob,'rotated-image.'+($('format').value==='image/jpeg'?'jpg':$('format').value.split('/')[1]))})})();</script></body></html>
