<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Free online QR Code Generator. Create QR codes from text, URLs, WiFi credentials, and more.">
    <title>QR Code Generator | MasoomDev</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root {
            --primary: #6c2bc4;
            --primary-light: #8b5cf6;
            --bg: #090d19;
            --surface: #131a2d;
            --text: #eef2ff;
            --muted: #a8b3cc;
            --border: #ffffff14;
            --success: #10b981;
            --error: #ef4444;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 40px;
        }
        header h1 { font-size: clamp(28px, 4vw, 42px); margin-bottom: 12px; }
        header .kicker {
            color: var(--primary-light);
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        header p { color: var(--muted); font-size: 16px; }
        .back-link { display: inline-block; color: var(--primary-light); margin-bottom: 20px; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 32px;
            margin-bottom: 24px;
        }
        .card h2 { font-size: 24px; margin-bottom: 16px; }
        .card p { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #0c1121;
            color: var(--text);
            font: inherit;
            font-size: 15px;
        }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(108, 43, 196, 0.2); }
        .form-group textarea { min-height: 100px; resize: vertical; }
        
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 9px;
            border: 1px solid #ffffff24; border-radius: 13px; padding: 13px 24px;
            background: #ffffff0a; color: white; font: inherit; font-weight: 700;
            cursor: pointer; transition: all 0.2s; font-size: 15px;
        }
        .btn:hover { background: #ffffff16; border-color: #ffffff33; }
        .btn.primary { background: linear-gradient(110deg, #8b5cf6, #5b55e9); border: 0; box-shadow: 0 12px 35px rgba(109, 40, 217, 0.4); }
        .btn.secondary { background: #ffffff08; border: 1px solid #8b5cf640; color: var(--primary-light); }
        
        .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
        
        .qr-preview {
            display: flex; flex-direction: column; align-items: center; gap: 16px;
            padding: 24px; border: 1px solid var(--border); border-radius: 16px;
            background: #0a0e1b; margin-top: 24px;
        }
        .qr-code-box {
            width: 250px; height: 250px; background: white; padding: 16px;
            border-radius: 12px; display: grid; place-items: center; overflow: hidden;
        }
        .qr-code-box img { width: 100%; height: 100%; object-fit: contain; }
        .preview-info { text-align: center; color: var(--muted); font-size: 13px; }
        .download-btn { margin-top: 16px; }
        
        .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 24px; flex-wrap: wrap; }
        .tab {
            padding: 12px 20px; background: transparent; border: 0;
            border-bottom: 3px solid transparent; color: var(--muted);
            cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s;
        }
        .tab:hover { color: var(--text); background: #ffffff05; }
        .tab.active { color: var(--primary-light); border-bottom-color: var(--primary); background: #ffffff08; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        
        .error { color: var(--error); padding: 12px; background: rgba(239, 68, 68, 0.1); border-radius: 8px; margin-bottom: 16px; display: none; }
        .success-message { color: var(--success); padding: 12px; background: rgba(16, 185, 129, 0.1); border-radius: 8px; margin-bottom: 16px; display: none; }
        
        footer { text-align: center; padding: 40px 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
        footer a { color: var(--primary-light); }
        
        @media (max-width: 760px) {
            .container { padding: 16px; }
            header { padding: 24px 16px; }
            .card { padding: 20px; }
            .form-row { grid-template-columns: 1fr; }
            .qr-code-box { width: 200px; height: 200px; }
            .tabs { overflow-x: auto; }
        }
    </style>
    <script src="/assets/md2-foundation.js?v=1" defer></script>
    <script src="/assets/md-pwa.js" defer></script>
</head>
<body>
    <header>
        <span class="kicker">FREE ONLINE TOOL</span>
        <h1>QR Code Generator</h1>
        <p>Create QR codes instantly. No data sent to external servers.</p>
    </header>
    
    <div class="container">
        <a href="/tools/" class="back-link">← All Tools</a>
        
        <div class="card">
            <div class="tabs">
                <button class="tab active" data-tab="text" onclick="switchTab('text')">Text/URL</button>
                <button class="tab" data-tab="wifi" onclick="switchTab('wifi')">WiFi</button>
                <button class="tab" data-tab="email" onclick="switchTab('email')">Email</button>
                <button class="tab" data-tab="sms" onclick="switchTab('sms')">SMS</button>
                <button class="tab" data-tab="phone" onclick="switchTab('phone')">Phone</button>
                <button class="tab" data-tab="location" onclick="switchTab('location')">Location</button>
            </div>
            
            <div class="tab-panel active" id="text-panel">
                <div class="form-group">
                    <label for="text-input">Text or URL</label>
                    <textarea id="text-input" placeholder="https://masoomdev.online/" rows="4">https://masoomdev.online/</textarea>
                </div>
                <div class="form-group">
                    <label for="qr-size">Size (pixels)</label>
                    <select id="qr-size">
                        <option value="100">100x100</option>
                        <option value="150">150x150</option>
                        <option value="200" selected>200x200</option>
                        <option value="250">250x250</option>
                        <option value="300">300x300</option>
                        <option value="400">400x400</option>
                        <option value="500">500x500</option>
                    </select>
                </div>
                <div class="actions">
                    <button class="btn primary" onclick="generateQR()">Generate QR Code</button>
                    <button class="btn secondary" onclick="clearQR()">Clear</button>
                </div>
            </div>
            
            <div class="tab-panel" id="wifi-panel">
                <div class="form-row">
                    <div class="form-group">
                        <label for="wifi-ssid">Network Name (SSID)</label>
                        <input type="text" id="wifi-ssid" placeholder="MyWiFi">
                    </div>
                    <div class="form-group">
                        <label for="wifi-password">Password</label>
                        <input type="text" id="wifi-password" placeholder="Password">
                    </div>
                </div>
                <div class="form-group">
                    <label for="wifi-security">Security</label>
                    <select id="wifi-security">
                        <option value="WPA">WPA/WPA2</option>
                        <option value="WEP">WEP</option>
                        <option value="nopass">No Password</option>
                    </select>
                </div>
                <div class="actions">
                    <button class="btn primary" onclick="generateWiFiQR()">Generate WiFi QR</button>
                    <button class="btn secondary" onclick="clearQR()">Clear</button>
                </div>
            </div>
            
            <div class="tab-panel" id="email-panel">
                <div class="form-row">
                    <div class="form-group">
                        <label for="email-to">To</label>
                        <input type="email" id="email-to" placeholder="recipient@example.com">
                    </div>
                    <div class="form-group">
                        <label for="email-subject">Subject</label>
                        <input type="text" id="email-subject" placeholder="Hello">
                    </div>
                </div>
                <div class="form-group">
                    <label for="email-body">Message (Optional)</label>
                    <textarea id="email-body" placeholder="Your message..." rows="2"></textarea>
                </div>
                <div class="actions">
                    <button class="btn primary" onclick="generateEmailQR()">Generate Email QR</button>
                    <button class="btn secondary" onclick="clearQR()">Clear</button>
                </div>
            </div>
            
            <div class="tab-panel" id="sms-panel">
                <div class="form-row">
                    <div class="form-group">
                        <label for="sms-phone">Phone Number</label>
                        <input type="tel" id="sms-phone" placeholder="+1234567890">
                    </div>
                    <div class="form-group">
                        <label for="sms-message">Message (Optional)</label>
                        <input type="text" id="sms-message" placeholder="Hello">
                    </div>
                </div>
                <div class="actions">
                    <button class="btn primary" onclick="generateSMSQR()">Generate SMS QR</button>
                    <button class="btn secondary" onclick="clearQR()">Clear</button>
                </div>
            </div>
            
            <div class="tab-panel" id="phone-panel">
                <div class="form-group">
                    <label for="phone-number">Phone Number</label>
                    <input type="tel" id="phone-number" placeholder="+1234567890">
                </div>
                <div class="actions">
                    <button class="btn primary" onclick="generatePhoneQR()">Generate Phone QR</button>
                    <button class="btn secondary" onclick="clearQR()">Clear</button>
                </div>
            </div>
            
            <div class="tab-panel" id="location-panel">
                <div class="form-row">
                    <div class="form-group">
                        <label for="location-lat">Latitude</label>
                        <input type="text" id="location-lat" placeholder="40.7128">
                    </div>
                    <div class="form-group">
                        <label for="location-lng">Longitude</label>
                        <input type="text" id="location-lng" placeholder="-74.0060">
                    </div>
                </div>
                <div class="form-group">
                    <label for="location-label">Label (Optional)</label>
                    <input type="text" id="location-label" placeholder="New York City">
                </div>
                <div class="actions">
                    <button class="btn primary" onclick="generateLocationQR()">Generate Location QR</button>
                    <button class="btn secondary" onclick="clearQR()">Clear</button>
                </div>
            </div>
        </div>
        
        <div class="error" id="error-message"></div>
        <div class="success-message" id="success-message"></div>
        
        <div class="qr-preview">
            <h2>Your QR Code</h2>
            <div class="qr-code-box" id="qr-code-container">
                <p style="color: var(--muted); text-align: center; padding: 20px;">Enter text and click Generate</p>
            </div>
            <div class="preview-info" id="preview-info"></div>
            <button class="btn primary download-btn" id="download-btn" onclick="downloadQR()" style="display: none;">Download QR Code</button>
        </div>
    </div>
    
    <footer>
        <p>© 2026 MasoomDev. All rights reserved. | <a href="/">Home</a> | <a href="/apps/">Apps</a> | <a href="/tools/">Tools</a> | <a href="/privacy/">Privacy</a></p>
    </footer>
    
    <script>
        let currentQRImage = null;
        let currentQRData = null;
        
        function switchTab(tabName) {
            // Hide all panels
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            // Show selected
            document.getElementById(tabName + '-panel').classList.add('active');
            document.querySelector('[data-tab="' + tabName + '"]').classList.add('active');
            
            clearQR();
        }
        
        function generateQR() {
            const text = document.getElementById('text-input').value;
            if (!text || text.trim() === '') {
                showError('Please enter some text or URL');
                return;
            }
            
            const size = parseInt(document.getElementById('qr-size').value);
            generateQRCode(text, size, 'Text/URL');
        }
        
        function generateWiFiQR() {
            const ssid = document.getElementById('wifi-ssid').value;
            const password = document.getElementById('wifi-password').value;
            const security = document.getElementById('wifi-security').value;
            
            if (!ssid) {
                showError('Please enter WiFi network name (SSID)');
                return;
            }
            
            let wifiData = 'WIFI:T:' + security + ';S:' + ssid + ';';
            if (security !== 'nopass') {
                wifiData += 'P:' + password + ';';
            }
            wifiData += ';;';
            
            generateQRCode(wifiData, 200, 'WiFi: ' + ssid);
        }
        
        function generateEmailQR() {
            const to = document.getElementById('email-to').value;
            const subject = document.getElementById('email-subject').value;
            const body = document.getElementById('email-body').value;
            
            if (!to) {
                showError('Please enter recipient email');
                return;
            }
            
            let emailData = 'mailto:' + to;
            if (subject) {
                emailData += '?subject=' + encodeURIComponent(subject);
            }
            if (body) {
                emailData += (subject ? '&' : '?') + 'body=' + encodeURIComponent(body);
            }
            
            generateQRCode(emailData, 200, 'Email: ' + to);
        }
        
        function generateSMSQR() {
            const phone = document.getElementById('sms-phone').value;
            const message = document.getElementById('sms-message').value;
            
            if (!phone) {
                showError('Please enter phone number');
                return;
            }
            
            let smsData = 'smsto:' + phone;
            if (message) {
                smsData += ':' + message;
            }
            
            generateQRCode(smsData, 200, 'SMS: ' + phone);
        }
        
        function generatePhoneQR() {
            const phone = document.getElementById('phone-number').value;
            
            if (!phone) {
                showError('Please enter phone number');
                return;
            }
            
            const phoneData = 'tel:' + phone;
            generateQRCode(phoneData, 200, 'Phone: ' + phone);
        }
        
        function generateLocationQR() {
            const lat = document.getElementById('location-lat').value;
            const lng = document.getElementById('location-lng').value;
            const label = document.getElementById('location-label').value;
            
            if (!lat || !lng) {
                showError('Please enter latitude and longitude');
                return;
            }
            
            let locationData = 'geo:' + lat + ',' + lng;
            if (label) {
                locationData += '?q=' + lat + ',' + lng + '(' + encodeURIComponent(label) + ')';
            }
            
            generateQRCode(locationData, 200, 'Location: ' + (label || lat + ', ' + lng));
        }
        
        function generateQRCode(text, size, label) {
            hideError();
            showLoading();
            
            // Use Google Charts API (reliable and simple)
            const url = 'https://chart.googleapis.com/chart?chs=' + size + 'x' + size + 
                       '&cht=qr&chl=' + encodeURIComponent(text) + 
                       '&choe=UTF-8&chld=H|0';
            
            currentQRData = text;
            
            const img = new Image();
            img.onload = function() {
                hideLoading();
                displayQRCode(img, label);
            };
            img.onerror = function() {
                hideLoading();
                showError('Failed to generate QR code. Please try again.');
            };
            img.src = url;
            img.alt = 'QR Code for: ' + text;
        }
        
        function displayQRCode(img, label) {
            const container = document.getElementById('qr-code-container');
            container.innerHTML = '';
            container.appendChild(img);
            
            currentQRImage = img;
            
            document.getElementById('preview-info').textContent = label;
            document.getElementById('download-btn').style.display = 'inline-flex';
            
            showSuccess('QR code generated!');
        }
        
        function clearQR() {
            const container = document.getElementById('qr-code-container');
            container.innerHTML = '<p style="color: var(--muted); text-align: center; padding: 20px;">Enter text and click Generate</p>';
            document.getElementById('preview-info').textContent = '';
            document.getElementById('download-btn').style.display = 'none';
            hideError();
            hideSuccess();
            currentQRImage = null;
            currentQRData = null;
        }
        
        function downloadQR() {
            if (!currentQRImage) {
                showError('No QR code to download');
                return;
            }
            
            const link = document.createElement('a');
            link.href = currentQRImage.src;
            link.download = 'qr-code.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showSuccess('QR code downloaded!');
        }
        
        function showLoading() {
            const container = document.getElementById('qr-code-container');
            container.innerHTML = '<p style="color: var(--muted); text-align: center; padding: 20px;">Generating...</p>';
        }
        
        function hideLoading() {
            // Will be replaced by actual QR code
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => { errorDiv.style.display = 'none'; }, 5000);
        }
        
        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => { successDiv.style.display = 'none'; }, 3000);
        }
        
        function hideSuccess() {
            document.getElementById('success-message').style.display = 'none';
        }
        
        // Pre-fill with default text
        document.addEventListener('DOMContentLoaded', function() {
            // Auto-generate on load if there's text
            const defaultText = document.getElementById('text-input').value;
            if (defaultText) {
                generateQR();
            }
        });
    </script>
</body>
</html>
