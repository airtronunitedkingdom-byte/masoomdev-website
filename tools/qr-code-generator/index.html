    <script>
        // QR Code Generation Library (Minimal implementation)
        function QRCode(data, options) {
            this.data = data;
            this.options = options || {};
            this.canvas = null;
            this.ctx = null;
        }
        
        QRCode.prototype.render = function() {
            const canvas = document.createElement('canvas');
            const size = this.options.size || 250;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = this.options.bgColor || '#ffffff';
            ctx.fillRect(0, 0, size, size);
            
            // QR Code data would be encoded here
            // For simplicity, we'll use a placeholder approach
            const qr = qrcode(0, 'M');
            qr.addData(this.data);
            qr.make();
            
            const fgColor = this.options.fgColor || '#000000';
            const moduleSize = size / qr.moduleCount;
            
            qr.modules.data.forEach((isDark, i) => {
                if (isDark) {
                    const row = Math.floor(i / qr.moduleCount);
                    const col = i % qr.moduleCount;
                    ctx.fillStyle = fgColor;
                    ctx.fillRect(col * moduleSize, row * moduleSize, moduleSize, moduleSize);
                }
            });
            
            return canvas;
        };
        
        // Simplified qrcode library
        function qrcode(typeNumber, errorCorrectLevel) {
            const qr = {
                typeNumber: typeNumber,
                errorCorrectLevel: errorCorrectLevel,
                moduleCount: 0,
                modules: null,
                dataCache: null,
                dataList: [],
                
                addData: function(data) {
                    this.dataList.push(data);
                },
                
                make: function() {
                    this.makeImpl(true, this.getBestMaskPattern());
                },
                
                getBestMaskPattern: function() {
                    return 0;
                },
                
                makeImpl: function(test, maskPattern) {
                    this.moduleCount = this.getModuleCount();
                    this.modules = new Array(this.moduleCount);
                    for (let row = 0; row < this.moduleCount; row++) {
                        this.modules[row] = new Array(this.moduleCount);
                        for (let col = 0; col < this.moduleCount; col++) {
                            this.modules[row][col] = null;
                        }
                    }
                    this.setupPositionProbePattern(0, 0);
                    this.setupPositionProbePattern(this.moduleCount - 7, 0);
                    this.setupPositionProbePattern(0, this.moduleCount - 7);
                    this.setupPositionAdjustPattern();
                    this.setupTimingPattern();
                    
                    if (this.typeNumber >= 7) {
                        this.setupTypeInfo(test, maskPattern);
                    }
                    
                    if (this.typeNumber * 4 + 17 <= this.moduleCount) {
                        this.setupTypeNumber(test);
                    }
                    
                    if (this.dataCache == null) {
                        this.dataCache = this.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
                    }
                    
                    this.mapData(this.createBytes(this.dataCache, maskPattern), maskPattern);
                },
                
                getModuleCount: function() {
                    const type = this.typeNumber;
                    return 21 + (type - 1) * 4;
                },
                
                setupPositionProbePattern: function(row, col) {
                    for (let r = -4; r <= 4; r++) {
                        for (let c = -4; c <= 4; c++) {
                            if (row + r <= -1 || this.moduleCount <= row + r || col + c <= -1 || this.moduleCount <= col + c) {
                                continue;
                            }
                            if ((0 <= r && r <= 2 && (c == -2 || c == 2)) || (0 <= c && c <= 2 && (r == -2 || r == 2)) || (r == 0 && c == 0)) {
                                this.modules[row + r][col + c] = true;
                            } else {
                                this.modules[row + r][col + c] = false;
                            }
                        }
                    }
                    for (let i = 0; i < 3; i++) {
                        this.modules[row + i][col + 6] = true;
                        this.modules[row + 6][col + i] = true;
                    }
                },
                
                setupTimingPattern: function() {
                    for (let r = 8; r < this.moduleCount - 8; r++) {
                        if (this.modules[r][6] != null) {
                            this.modules[r][6] = (r % 2 == 0);
                        }
                    }
                    for (let c = 8; c < this.moduleCount - 8; c++) {
                        if (this.modules[6][c] != null) {
                            this.modules[6][c] = (c % 2 == 0);
                        }
                    }
                },
                
                setupPositionAdjustPattern: function() {
                    const pos = this.getPatternPosition(this.typeNumber);
                    for (let i = 0; i < pos.length; i++) {
                        for (let j = 0; j < pos.length; j++) {
                            const row = pos[i];
                            const col = pos[j];
                            if (this.modules[row][col] != null) {
                                continue;
                            }
                            for (let r = -2; r <= 2; r++) {
                                for (let c = -2; c <= 2; c++) {
                                    if (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0)) {
                                        this.modules[row + r][col + c] = true;
                                    } else {
                                        this.modules[row + r][col + c] = false;
                                    }
                                }
                            }
                        }
                    }
                },
                
                getPatternPosition: function(type) {
                    return [];
                },
                
                createData: function(typeNumber, errorCorrectLevel, dataList) {
                    return { data: this.convertData(dataList), ec: errorCorrectLevel };
                },
                
                convertData: function(dataList) {
                    let buffer = new Uint8Array(0);
                    dataList.forEach(data => {
                        const mode = this.chooseMode(data);
                        const bytes = this.createBytesForMode(mode, data);
                        buffer = this.concatBytes(buffer, bytes);
                    });
                    return buffer;
                },
                
                chooseMode: function(data) {
                    if (typeof data === 'string') {
                        return 'Numeric';
                    }
                    return 'Byte';
                },
                
                createBytesForMode: function(mode, data) {
                    return new TextEncoder().encode(data);
                },
                
                concatBytes: function(a, b) {
                    const result = new Uint8Array(a.length + b.length);
                    result.set(a);
                    result.set(b, a.length);
                    return result;
                },
                
                createBytes: function(data, maskPattern) {
                    return data.data;
                },
                
                mapData: function(data, maskPattern) {
                    let inc = -1;
                    const row = this.moduleCount - 1;
                    for (let col = this.moduleCount - 1; col > 0; col -= 2) {
                        if (this.modules[row][col] == null) {
                            let dark = false;
                            if (inc == -1) {
                                dark = false;
                            } else {
                                dark = ((data[inc] & (1 << (7 - mod(col, 8)))) != 0);
                            }
                            if (dark) {
                                this.modules[row][col] = true;
                            }
                            inc++;
                        }
                    }
                }
            };
            return qr;
        }
        
        // Use a better approach - load from CDN
        let qrcodeLibLoaded = false;
        let qrCodeQueue = [];
        
        function loadQRCodeLib() {
            if (qrcodeLibLoaded) return;
            
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js';
            script.onload = function() {
                qrcodeLibLoaded = true;
                processQueue();
            };
            script.onerror = function() {
                // Fallback - try another CDN
                const fallback = document.createElement('script');
                fallback.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
                fallback.onload = function() {
                    qrcodeLibLoaded = true;
                    processQueue();
                };
                document.head.appendChild(fallback);
            };
            document.head.appendChild(script);
        }
        
        function processQueue() {
            while (qrCodeQueue.length > 0) {
                const { data, options, callback } = qrCodeQueue.shift();
                generateQRCode(data, options, callback);
            }
        }
        
        function generateQRCode(data, options, callback) {
            try {
                if (typeof qrcode === 'function') {
                    const qr = new QRCode(document.createElement('div'), {
                        text: data,
                        width: options.size || 250,
                        height: options.size || 250,
                        colorDark: options.fgColor || '#000000',
                        colorLight: options.bgColor || '#ffffff',
                        correctLevel: getErrorCorrectionLevel(options.errorCorrection || 'M')
                    });
                    callback(qr);
                } else if (window.QRCode) {
                    // Different library format
                    const qr = new window.QRCode(document.createElement('div'), {
                        text: data,
                        width: options.size || 250,
                        height: options.size || 250,
                        colorDark: options.fgColor || '#000000',
                        colorLight: options.bgColor || '#ffffff',
                        correctLevel: getErrorCorrectionLevel(options.errorCorrection || 'M')
                    });
                    callback(qr);
                }
            } catch (e) {
                console.error('QR generation error:', e);
                showError('Failed to generate QR code. Please try again.');
            }
        }
        
        function getErrorCorrectionLevel(level) {
            const map = { L: 'L', M: 'M', Q: 'Q', H: 'H' };
            return map[level] || 'M';
        }
        
        // Current QR state
        let currentQRData = null;
        let currentQROptions = null;
        let currentQRCanvas = null;
        let history = [];
        
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(this.dataset.tab + '-panel').classList.add('active');
                clearQR();
            });
        });
        
        // Color picker
        document.querySelectorAll('.color-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.color-option').forEach(o => o.classList.remove('active'));
                this.classList.add('active');
            });
        });
        
        // Format selector
        document.querySelectorAll('.format-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });
        
        function generateQR() {
            const input = document.getElementById('text-input').value;
            if (!input || input.trim() === '') {
                showError('Please enter some text or URL');
                return;
            }
            
            const size = parseInt(document.getElementById('qr-size').value);
            const errorCorrection = document.getElementById('error-correction').value;
            const activeColor = document.querySelector('.color-option.active');
            const fgColor = activeColor ? activeColor.dataset.foreground : '#000000';
            const bgColor = activeColor ? activeColor.dataset.background : '#ffffff';
            
            loadQRCodeLib();
            
            qrCodeQueue.push({
                data: input,
                options: { size, errorCorrection, fgColor, bgColor },
                callback: function(qr) {
                    displayQRCode(qr, input, 'Text/URL');
                }
            });
            
            if (qrcodeLibLoaded) processQueue();
        }
        
        function generateWiFiQR() {
            const ssid = document.getElementById('wifi-ssid').value;
            const password = document.getElementById('wifi-password').value;
            const security = document.getElementById('wifi-security').value;
            const hidden = document.getElementById('wifi-hidden').value === 'true';
            
            if (!ssid) {
                showError('Please enter WiFi network name (SSID)');
                return;
            }
            
            let wifiData = `WIFI:T:${security};S:${ssid};`;
            if (security !== 'nopass') {
                wifiData += `P:${password};`;
            }
            if (hidden) {
                wifiData += `H:true;`;
            }
            wifiData += `;;`;
            
            const size = parseInt(document.getElementById('qr-size').value);
            const errorCorrection = document.getElementById('error-correction').value;
            const activeColor = document.querySelector('.color-option.active');
            const fgColor = activeColor ? activeColor.dataset.foreground : '#000000';
            const bgColor = activeColor ? activeColor.dataset.background : '#ffffff';
            
            loadQRCodeLib();
            
            qrCodeQueue.push({
                data: wifiData,
                options: { size, errorCorrection, fgColor, bgColor },
                callback: function(qr) {
                    displayQRCode(qr, `WiFi: ${ssid}`, 'WiFi');
                }
            });
            
            if (qrcodeLibLoaded) processQueue();
        }
        
        function generateEmailQR() {
            const to = document.getElementById('email-to').value;
            const subject = document.getElementById('email-subject').value;
            const body = document.getElementById('email-body').value;
            
            if (!to) {
                showError('Please enter recipient email');
                return;
            }
            
            let emailData = `mailto:${to}`;
            if (subject) {
                emailData += `?subject=${encodeURIComponent(subject)}`;
            }
            if (body) {
                emailData += `${subject ? '&' : '?'}body=${encodeURIComponent(body)}`;
            }
            
            const size = parseInt(document.getElementById('qr-size').value);
            const errorCorrection = document.getElementById('error-correction').value;
            const activeColor = document.querySelector('.color-option.active');
            const fgColor = activeColor ? activeColor.dataset.foreground : '#000000';
            const bgColor = activeColor ? activeColor.dataset.background : '#ffffff';
            
            loadQRCodeLib();
            
            qrCodeQueue.push({
                data: emailData,
                options: { size, errorCorrection, fgColor, bgColor },
                callback: function(qr) {
                    displayQRCode(qr, `Email: ${to}`, 'Email');
                }
            });
            
            if (qrcodeLibLoaded) processQueue();
        }
        
        function generateSMSQR() {
            const phone = document.getElementById('sms-phone').value;
            const message = document.getElementById('sms-message').value;
            
            if (!phone) {
                showError('Please enter phone number');
                return;
            }
            
            let smsData = `smsto:${phone}`;
            if (message) {
                smsData += `:${message}`;
            }
            
            const size = parseInt(document.getElementById('qr-size').value);
            const errorCorrection = document.getElementById('error-correction').value;
            const activeColor = document.querySelector('.color-option.active');
            const fgColor = activeColor ? activeColor.dataset.foreground : '#000000';
            const bgColor = activeColor ? activeColor.dataset.background : '#ffffff';
            
            loadQRCodeLib();
            
            qrCodeQueue.push({
                data: smsData,
                options: { size, errorCorrection, fgColor, bgColor },
                callback: function(qr) {
                    displayQRCode(qr, `SMS: ${phone}`, 'SMS');
                }
            });
            
            if (qrcodeLibLoaded) processQueue();
        }
        
        function generatePhoneQR() {
            const phone = document.getElementById('phone-number').value;
            
            if (!phone) {
                showError('Please enter phone number');
                return;
            }
            
            const phoneData = `tel:${phone}`;
            
            const size = parseInt(document.getElementById('qr-size').value);
            const errorCorrection = document.getElementById('error-correction').value;
            const activeColor = document.querySelector('.color-option.active');
            const fgColor = activeColor ? activeColor.dataset.foreground : '#000000';
            const bgColor = activeColor ? activeColor.dataset.background : '#ffffff';
            
            loadQRCodeLib();
            
            qrCodeQueue.push({
                data: phoneData,
                options: { size, errorCorrection, fgColor, bgColor },
                callback: function(qr) {
                    displayQRCode(qr, `Phone: ${phone}`, 'Phone');
                }
            });
            
            if (qrcodeLibLoaded) processQueue();
        }
        
        function generateLocationQR() {
            const lat = document.getElementById('location-lat').value;
            const lng = document.getElementById('location-lng').value;
            const label = document.getElementById('location-label').value;
            
            if (!lat || !lng) {
                showError('Please enter latitude and longitude');
                return;
            }
            
            let locationData = `geo:${lat},${lng}`;
            if (label) {
                locationData += `?q=${lat},${lng}(${encodeURIComponent(label)})`;
            }
            
            const size = parseInt(document.getElementById('qr-size').value);
            const errorCorrection = document.getElementById('error-correction').value;
            const activeColor = document.querySelector('.color-option.active');
            const fgColor = activeColor ? activeColor.dataset.foreground : '#000000';
            const bgColor = activeColor ? activeColor.dataset.background : '#ffffff';
            
            loadQRCodeLib();
            
            qrCodeQueue.push({
                data: locationData,
                options: { size, errorCorrection, fgColor, bgColor },
                callback: function(qr) {
                    displayQRCode(qr, `Location: ${label || lat}, ${lng}`, 'Location');
                }
            });
            
            if (qrcodeLibLoaded) processQueue();
        }
        
        function displayQRCode(qrElement, label, type) {
            hideError();
            
            // Get canvas from QR element
            let canvas = null;
            if (qrElement && qrElement.querySelector && qrElement.querySelector('canvas')) {
                canvas = qrElement.querySelector('canvas');
            } else if (qrElement && qrElement._el && qrElement._el.querySelector) {
                canvas = qrElement._el.querySelector('canvas');
            } else if (qrElement && qrElement.canvas) {
                canvas = qrElement.canvas;
            } else if (typeof qrElement === 'object' && qrElement._oDrawing) {
                // Different library structure
                canvas = qrElement._oDrawing._el.querySelector('canvas');
            }
            
            // Fallback - create canvas manually
            if (!canvas) {
                const container = document.createElement('div');
                container.id = 'qr-temp-container';
                document.body.appendChild(container);
                
                const qr = new QRCode(container, {
                    text: currentQRData,
                    width: currentQROptions.size,
                    height: currentQROptions.size,
                    colorDark: currentQROptions.fgColor,
                    colorLight: currentQROptions.bgColor
                });
                
                canvas = container.querySelector('canvas');
            }
            
            if (canvas) {
                currentQRCanvas = canvas;
                const qrContainer = document.getElementById('qr-code-container');
                qrContainer.innerHTML = '';
                qrContainer.appendChild(canvas);
                
                document.getElementById('preview-info').textContent = label;
                document.getElementById('download-btn').style.display = 'inline-flex';
                
                // Add to history
                addToHistory(canvas, label, type);
                
                // Show success
                showSuccess('QR code generated successfully!');
            } else {
                showError('Could not generate QR code. Please try a different browser.');
            }
        }
        
        function addToHistory(canvas, label, type) {
            const historyGrid = document.getElementById('history-grid');
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            
            const smallCanvas = document.createElement('canvas');
            smallCanvas.width = 80;
            smallCanvas.height = 80;
            const smallCtx = smallCanvas.getContext('2d');
            smallCtx.drawImage(canvas, 0, 0, 80, 80);
            
            const img = document.createElement('img');
            img.src = smallCanvas.toDataURL();
            img.alt = label;
            
            const labelDiv = document.createElement('div');
            labelDiv.className = 'label';
            labelDiv.textContent = label;
            
            historyItem.appendChild(img);
            historyItem.appendChild(labelDiv);
            
            historyItem.onclick = function() {
                const qrContainer = document.getElementById('qr-code-container');
                qrContainer.innerHTML = '';
                qrContainer.appendChild(canvas.cloneNode(true));
                document.getElementById('preview-info').textContent = label;
                document.getElementById('download-btn').style.display = 'inline-flex';
            };
            
            historyGrid.insertBefore(historyItem, historyGrid.firstChild);
            
            // Keep only last 8 items
            if (historyGrid.children.length > 8) {
                historyGrid.removeChild(historyGrid.lastChild);
            }
            
            // Save to localStorage
            try {
                const historyData = JSON.parse(localStorage.getItem('qr-history') || '[]');
                historyData.unshift({ label, type, timestamp: Date.now() });
                if (historyData.length > 8) historyData.pop();
                localStorage.setItem('qr-history', JSON.stringify(historyData));
            } catch (e) {
                console.error('Could not save to localStorage:', e);
            }
        }
        
        function clearQR() {
            const qrContainer = document.getElementById('qr-code-container');
            qrContainer.innerHTML = '<p style="color: var(--muted); text-align: center;">Generate a QR code to see it here</p>';
            document.getElementById('preview-info').textContent = '';
            document.getElementById('download-btn').style.display = 'none';
            hideError();
            hideSuccess();
        }
        
        function clearHistory() {
            document.getElementById('history-grid').innerHTML = '';
            try {
                localStorage.removeItem('qr-history');
            } catch (e) {}
        }
        
        function downloadQR() {
            if (!currentQRCanvas) {
                showError('No QR code to download');
                return;
            }
            
            const formatBtn = document.querySelector('.format-btn.active');
            const format = formatBtn ? formatBtn.dataset.format : 'png';
            
            if (format === 'svg') {
                // For SVG, we need different handling
                const svgData = createSVGFromCanvas(currentQRCanvas);
                downloadFile(svgData, `qr-code.svg`, 'image/svg+xml');
            } else {
                const dataUrl = currentQRCanvas.toDataURL(`image/${format}`);
                downloadFile(dataUrl, `qr-code.${format}`, `image/${format}`);
            }
        }
        
        function createSVGFromCanvas(canvas) {
            // Simple SVG creation from canvas (approximation)
            const width = canvas.width;
            const height = canvas.height;
            const imageData = canvas.getContext('2d').getImageData(0, 0, width, height).data;
            
            // This is a simplified approach
            let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
            svg += '<rect width="100%" height="100%" fill="#ffffff"/>';
            
            // Add modules
            const moduleSize = Math.ceil(width / 25); // Approximate
            for (let y = 0; y < height; y += moduleSize) {
                for (let x = 0; x < width; x += moduleSize) {
                    const idx = (y * width + x) * 4;
                    if (imageData[idx] < 128) { // Dark module
                        svg += `<rect x="${x}" y="${y}" width="${moduleSize}" height="${moduleSize}" fill="#000000"/>`;
                    }
                }
            }
            svg += '</svg>';
            return svg;
        }
        
        function downloadFile(dataUrl, filename, mimeType) {
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = filename;
            link.type = mimeType;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showSuccess(`QR code downloaded as ${filename}!`);
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }
        
        function showSuccess(message) {
            const successDiv = document.querySelector('.success-message');
            if (successDiv) {
                successDiv.textContent = message;
                successDiv.style.display = 'block';
                setTimeout(() => {
                    successDiv.style.display = 'none';
                }, 3000);
            }
        }
        
        function hideSuccess() {
            const successDiv = document.querySelector('.success-message');
            if (successDiv) {
                successDiv.style.display = 'none';
            }
        }
        
        // Load history on page load
        document.addEventListener('DOMContentLoaded', function() {
            try {
                const historyData = JSON.parse(localStorage.getItem('qr-history') || '[]');
                // History items are just metadata, not actual images
                // We could reconstruct them, but for now just show placeholders
            } catch (e) {
                console.error('Could not load history:', e);
            }
            
            // Pre-load QR code library
            loadQRCodeLib();
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                const activeTab = document.querySelector('.tab.active');
                if (activeTab) {
                    const tabId = activeTab.dataset.tab;
                    switch(tabId) {
                        case 'text': generateQR(); break;
                        case 'wifi': generateWiFiQR(); break;
                        case 'email': generateEmailQR(); break;
                        case 'sms': generateSMSQR(); break;
                        case 'phone': generatePhoneQR(); break;
                        case 'location': generateLocationQR(); break;
                    }
                }
            }
        });
    </script>
</body>
