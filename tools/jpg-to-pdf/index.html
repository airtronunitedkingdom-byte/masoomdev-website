<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Convert one or more JPG or PNG images into a PDF."><title>JPG to PDF | MasoomDev</title><link rel="stylesheet" href="/assets/tool-shared.css"><style>.files{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%}small{color:#766b85}</style></head><body><header><a href="/tools/pdf-file-tools/">← PDF & File Tools</a></header><main><h1>JPG to PDF</h1><p>Convert one or more JPG or PNG images into a PDF. Your files are processed locally in your browser.</p><section class="panel"><label class="field">Select images<input id="files" type="file" accept="image/jpeg,image/png" multiple></label><label class="field">Page layout<select id="layout"><option value="fit">Fit image on A4 page</option><option value="original">Page matches image dimensions</option></select></label><button id="run">Create PDF</button><p id="status" role="status"></p></section><p><small>PDF and ZIP libraries may require internet access to load initially.</small></p></main><footer>MasoomDev • PDF & File Tools</footer><script src="/assets/tool-shared.js"></script><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id);$('run').onclick=async()=>{const files=Array.from($('files').files);if(!files.length){$('status').textContent='Select images.';return}if(!window.PDFLib){$('status').textContent='PDF library unavailable. Check internet connection.';return}try{$('run').disabled=true;const doc=await PDFLib.PDFDocument.create();for(const f of files){if(f.size>25*1048576)throw Error('Maximum 25 MB per image.');const bytes=await f.arrayBuffer(),image=f.type==='image/png'?await doc.embedPng(bytes):f.type==='image/jpeg'?await doc.embedJpg(bytes):null;if(!image)throw Error('Only JPG and PNG are supported.');const w=$('layout').value==='fit'?595.28:Math.min(image.width,14400),h=$('layout').value==='fit'?841.89:Math.min(image.height,14400),page=doc.addPage([w,h]),scale=Math.min(w/image.width,h/image.height);page.drawImage(image,{x:(w-image.width*scale)/2,y:(h-image.height*scale)/2,width:image.width*scale,height:image.height*scale})}MDTools.download(new Blob([await doc.save()],{type:'application/pdf'}),'images-to-pdf.pdf');$('status').textContent='Created PDF with '+files.length+' pages.'}catch(e){$('status').textContent=e.message}finally{$('run').disabled=false}}})();</script></body></html>
