<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Compress JPG, PNG and WebP images privately in your browser with adjustable quality and download."><title>Image Compressor | MasoomDev</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/assets/tool-shared.css"></head><body><header><a href="/tools/">← HTML Tools</a></header><main><h1>Image Compressor</h1><p>Compress images locally in your browser. No file uploads or login.</p><section class="panel"><div class="controls"><label class="field">Choose image<input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="field">Output format<select id="format"><option value="image/webp">WebP</option><option value="image/jpeg">JPG</option><option value="image/png">PNG (lossless)</option></select></label><label class="field">Quality: <output id="qvalue">80%</output><input id="quality" type="range" min="10" max="100" value="80"></label><button id="compress" disabled>Compress image</button></div><p id="status" class="status" role="status" aria-live="polite"></p></section><section class="panel" id="result" hidden><h2>Preview & download</h2><img id="preview" class="preview" alt="Compressed image preview"><p id="sizes"></p><button id="save">Download compressed image</button></section></main><footer>MasoomDev • Private browser-based image processing</footer><script src="/assets/tool-shared.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),file=$('file'),format=$('format'),quality=$('quality'),status=$('status'),result=$('result');let blob=null,previewUrl=null;quality.addEventListener('input',()=>{$('qvalue').textContent=quality.value+'%'});file.addEventListener('change',()=>{$('compress').disabled=!file.files.length;result.hidden=true;blob=null;status.textContent=''});$('compress').addEventListener('click',async()=>{const f=file.files[0];if(!f)return;status.textContent='Processing…';$('compress').disabled=true;result.hidden=true;try{const img=await MDTools.loadImage(f),canvas=document.createElement('canvas');if(img.naturalWidth*img.naturalHeight>40000000)throw Error('Image exceeds 40 megapixels.');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;const ctx=canvas.getContext('2d');if(format.value==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height)}ctx.drawImage(img,0,0);blob=await MDTools.canvasBlob(canvas,format.value,Number(quality.value)/100);if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(blob);$('preview').src=previewUrl;$('sizes').textContent='Original: '+MDTools.formatBytes(f.size)+' • Output: '+MDTools.formatBytes(blob.size)+' • Change: '+((blob.size/f.size-1)*100).toFixed(1)+'%';result.hidden=false;status.textContent='Image ready. Note: PNG is lossless; quality slider does not affect PNG.'}catch(e){status.textContent=e.message||'Processing failed.'}finally{$('compress').disabled=false}});$('save').addEventListener('click',()=>{if(!blob)return;const ext=format.value==='image/jpeg'?'jpg':format.value.split('/')[1];MDTools.download(blob,(file.files[0]?.name||'image').replace(/\.[^.]+$/,'')+'-compressed.'+ext)});window.addEventListener('pagehide',()=>{if(previewUrl)URL.revokeObjectURL(previewUrl)})})();</script></body></html>
