<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Glassmorphism Scientific Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        glassBorder: 'rgba(255, 255, 255, 0.18)',
                        glassBg: 'rgba(255, 255, 255, 0.05)',
                        glassCard: 'rgba(17, 24, 39, 0.65)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar and glass styling */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
            transform: translateY(-1px);
        }
        .glass-btn:active {
            transform: translateY(1px);
        }
        .glow-orange {
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.4);
        }
        .glow-purple {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }
        /* Custom scrollbar for history */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="h-full flex items-center justify-center p-2 sm:p-4 text-white overflow-x-hidden">

    <div class="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-3 gap-4 items-start">
        
        <!-- Calculator Main Body (2 Columns on large screens) -->
        <div class="lg:col-span-2 glass-panel rounded-3xl p-5 sm:p-6 relative overflow-hidden transition-all duration-300">
            <!-- Decorative gradient blobs -->
            <div class="absolute -top-24 -left-24 w-48 h-48 bg-purple-500 rounded-full filter blur-3xl opacity-20 pointer-events-none"></div>
            <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-blue-500 rounded-full filter blur-3xl opacity-20 pointer-events-none"></div>

            <!-- Header Controls -->
            <div class="flex justify-between items-center mb-4 relative z-10">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-red-500/80 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-yellow-500/80 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-green-500/80 inline-block"></span>
                    <span class="text-xs font-semibold tracking-wider text-gray-400 ml-2 uppercase">ProCalc Studio</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="toggle-mode" onclick="toggleScientificMode()" class="px-3 py-1 rounded-full text-xs font-medium bg-purple-500/20 text-purple-300 border border-purple-500/30 hover:bg-purple-500/30 transition">
                        <i class="fa-solid fa-flask mr-1"></i> Scientific
                    </button>
                    <button onclick="toggleHistoryDrawerMobile()" class="lg:hidden px-3 py-1 rounded-full text-xs font-medium bg-blue-500/20 text-blue-300 border border-blue-500/30 hover:bg-blue-500/30 transition">
                        <i class="fa-solid fa-clock-rotate-left mr-1"></i> History
                    </button>
                </div>
            </div>

            <!-- Display Screen -->
            <div class="bg-black/30 rounded-2xl p-4 mb-5 border border-white/10 relative z-10 shadow-inner flex flex-col justify-end min-h-[110px]">
                <div id="history-display" class="text-right text-xs sm:text-sm text-gray-400 font-mono tracking-wider h-6 overflow-x-auto whitespace-nowrap"></div>
                <div id="main-display" class="text-right text-3xl sm:text-4xl font-bold tracking-tight text-white font-mono overflow-x-auto whitespace-nowrap">0</div>
            </div>

            <!-- Keypad Grid -->
            <div id="keypad-container" class="grid grid-cols-4 gap-2.5 relative z-10 transition-all duration-300">
                <!-- Scientific Panel Row (Hidden by default, shown in scientific mode) -->
                <div id="sci-row-1" class="contents hidden">
                    <button onclick="appendFunction('sin')" class="glass-btn py-2.5 rounded-xl text-xs sm:text-sm font-medium text-purple-300">sin</button>
                    <button onclick="appendFunction('cos')" class="glass-btn py-2.5 rounded-xl text-xs sm:text-sm font-medium text-purple-300">cos</button>
                    <button onclick="appendFunction('tan')" class="glass-btn py-2.5 rounded-xl text-xs sm:text-sm font-medium text-purple-300">tan</button>
                    <button onclick="appendFunction('log')" class="glass-btn py-2.5 rounded-xl text-xs sm:text-sm font-medium text-purple-300">log</button>
                </div>
                <div id="sci-row-2" class="contents hidden">
                    <button onclick="appendFunction('ln')" class="glass-btn py-2.5 rounded-xl text-xs sm:text-sm font-medium text-purple-300">ln</button>
                    <button onclick="appendOperator('**')" class="glass-btn py-2.5 rounded-xl text-xs sm:text-sm font-medium text-purple-300">x^y</button>
                    <button onclick="appendConstant(Math.PI, 'π')" class="glass-btn py-2.5 rounded-xl text-xs sm:text-sm font-medium text-purple-300">π</button>
                    <button onclick="appendConstant(Math.E, 'e')" class="glass-btn py-2.5 rounded-xl text-xs sm:text-sm font-medium text-purple-300">e</button>
                </div>

                <!-- Standard Calculator Rows -->
                <button onclick="clearAll()" class="glass-btn py-3 rounded-xl text-sm font-semibold text-red-400 bg-red-500/10 border-red-500/20 hover:bg-red-500/20">AC</button>
                <button onclick="backspace()" class="glass-btn py-3 rounded-xl text-sm font-semibold text-yellow-400"><i class="fa-solid fa-delete-left"></i></button>
                <button onclick="appendValue('%')" class="glass-btn py-3 rounded-xl text-sm font-semibold text-cyan-300">%</button>
                <button onclick="appendOperator('/')" class="glass-btn py-3 rounded-xl text-sm font-semibold text-orange-400 bg-orange-500/10 border-orange-500/20 hover:bg-orange-500/20">÷</button>

                <button onclick="appendValue('7')" class="glass-btn py-3 rounded-xl text-base font-medium text-gray-200">7</button>
                <button onclick="appendValue('8')" class="glass-btn py-3 rounded-xl text-base font-medium text-gray-200">8</button>
                <button onclick="appendValue('9')" class="glass-btn py-3 rounded-xl text-base font-medium text-gray-200">9</button>
                <button onclick="appendOperator('*')" class="glass-btn py-3 rounded-xl text-sm font-semibold text-orange-400 bg-orange-500/10 border-orange-500/20 hover:bg-orange-500/20">×</button>

                <button onclick="appendValue('4')" class="glass-btn py-3 rounded-xl text-base font-medium text-gray-200">4</button>
                <button onclick="appendValue('5')" class="glass-btn py-3 rounded-xl text-base font-medium text-gray-200">5</button>
                <button onclick="appendValue('6')" class="glass-btn py-3 rounded-xl text-base font-medium text-gray-200">6</button>
                <button onclick="appendOperator('-')" class="glass-btn py-3 rounded-xl text-sm font-semibold text-orange-400 bg-orange-500/10 border-orange-500/20 hover:bg-orange-500/20">-</button>

                <button onclick="appendValue('1')" class="glass-btn py-3 rounded-xl text-base font-medium text-gray-200">1</button>
                <button onclick="appendValue('2')" class="glass-btn py-3 rounded-xl text-base font-medium text-gray-200">2</button>
                <button onclick="appendValue('3')" class="glass-btn py-3 rounded-xl text-base font-medium text-gray-200">3</button>
                <button onclick="appendOperator('+')" class="glass-btn py-3 rounded-xl text-sm font-semibold text-orange-400 bg-orange-500/10 border-orange-500/20 hover:bg-orange-500/20">+</button>

                <button onclick="appendFunction('sqrt')" class="glass-btn py-3 rounded-xl text-sm font-semibold text-purple-300">√</button>
                <button onclick="appendValue('0')" class="glass-btn py-3 rounded-xl text-base font-medium text-gray-200">0</button>
                <button onclick="appendValue('.')" class="glass-btn py-3 rounded-xl text-base font-medium text-gray-200">.</button>
                <button onclick="calculateResult()" class="glass-btn py-3 rounded-xl text-base font-semibold text-white bg-gradient-to-r from-orange-500 to-pink-500 border-none glow-orange hover:opacity-90">=</button>
            </div>
        </div>

        <!-- History Sidebar Panel -->
        <div id="history-panel" class="glass-panel rounded-3xl p-5 flex flex-col h-[480px] lg:h-auto lg:min-h-[500px] relative overflow-hidden transition-all duration-300">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-white/10">
                <h3 class="font-semibold text-sm tracking-wider text-gray-300 flex items-center">
                    <i class="fa-solid fa-clock-rotate-left mr-2 text-purple-400"></i> Calculation History
                </h3>
                <button onclick="clearHistory()" class="text-xs text-gray-400 hover:text-red-400 transition" title="Clear History">
                    <i class="fa-solid fa-trash-can"></i> Clear
                </button>
            </div>
            
            <!-- History Items Container -->
            <div id="history-list" class="flex-1 overflow-y-auto space-y-3 pr-1 text-sm">
                <div class="text-center text-gray-500 py-12 text-xs italic">No history yet</div>
            </div>
        </div>

    </div>

    <script>
        let currentInput = "0";
        let historyExpression = "";
        let calculationHistory = [];
        let isScientificMode = false;
        let evaluated = false;

        const mainDisplay = document.getElementById("main-display");
        const historyDisplay = document.getElementById("history-display");
        const historyList = document.getElementById("history-list");

        // Update UI displays
        function updateDisplay() {
            mainDisplay.innerText = currentInput;
            historyDisplay.innerText = historyExpression;
            // Auto scroll to right for long numbers
            mainDisplay.scrollLeft = mainDisplay.scrollWidth;
        }

        // Append basic values (numbers, decimal point)
        function appendValue(val) {
            if (evaluated) {
                currentInput = "0";
                evaluated = false;
            }
            if (currentInput === "0" && val !== ".") {
                currentInput = val;
            } else {
                currentInput += val;
            }
            updateDisplay();
        }

        // Append operators (+, -, *, /, etc.)
        function appendOperator(op) {
            if (evaluated) {
                evaluated = false;
            }
            const lastChar = currentInput.slice(-1);
            if ("+-*/".includes(lastChar)) {
                currentInput = currentInput.slice(0, -1) + op;
            } else {
                currentInput += op;
            }
            updateDisplay();
        }

        // Append constants like PI or e
        function appendConstant(val, symbol) {
            if (evaluated || currentInput === "0") {
                currentInput = symbol;
                evaluated = false;
            } else {
                currentInput += symbol;
            }
            updateDisplay();
        }

        // Append functions like sin, cos, tan, log, ln, sqrt
        function appendFunction(func) {
            if (evaluated || currentInput === "0") {
                currentInput = func + "(";
                evaluated = false;
            } else {
                currentInput += func + "(";
            }
            updateDisplay();
        }

        // Clear all inputs
        function clearAll() {
            currentInput = "0";
            historyExpression = "";
            evaluated = false;
            updateDisplay();
        }

        // Backspace delete
        function backspace() {
            if (evaluated) {
                currentInput = "0";
                evaluated = false;
            } else if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = "0";
            }
            updateDisplay();
        }

        // Toggle Scientific Mode layout
        function toggleScientificMode() {
            isScientificMode = !isScientificMode;
            const sciRow1 = document.getElementById("sci-row-1");
            const sciRow2 = document.getElementById("sci-row-2");
            const btn = document.getElementById("toggle-mode");

            if (isScientificMode) {
                sciRow1.classList.remove("hidden");
                sciRow2.classList.remove("hidden");
                btn.classList.add("bg-purple-500/40", "border-purple-500");
                btn.innerHTML = '<i class="fa-solid fa-calculator mr-1"></i> Standard';
            } else {
                sciRow1.classList.add("hidden");
                sciRow2.classList.add("hidden");
                btn.classList.remove("bg-purple-500/40", "border-purple-500");
                btn.innerHTML = '<i class="fa-solid fa-flask mr-1"></i> Scientific';
            }
        }

        // Toggle mobile history drawer view
        function toggleHistoryDrawerMobile() {
            const historyPanel = document.getElementById("history-panel");
            historyPanel.scrollIntoView({ behavior: 'smooth' });
        }

        // Calculate Result logic with secure parsing & scientific evaluation
        function calculateResult() {
            if (!currentInput || currentInput === "0") return;

            historyExpression = currentInput + " =";
            
            try {
                // Replace mathematical symbols with JS evaluatable equivalents
                let expressionToEval = currentInput
                    .replace(/π/g, `(${Math.PI})`)
                    .replace(/e/g, `(${Math.E})`)
                    .replace(/sin\(/g, 'Math.sin(Math.PI / 180 * ') // Degrees mode support
                    .replace(/cos\(/g, 'Math.cos(Math.PI / 180 * ')
                    .replace(/tan\(/g, 'Math.tan(Math.PI / 180 * ')
                    .replace(/log\(/g, 'Math.log10(')
                    .replace(/ln\(/g, 'Math.log(')
                    .replace(/sqrt\(/g, 'Math.sqrt(')
                    .replace(/%/g, '/100');

                let result = eval(expressionToEval);

                if (!isFinite(result) || isNaN(result)) {
                    throw new Error("Invalid Calculation");
                }

                // Format decimals nicely (max 8 decimal places)
                result = parseFloat(result.toFixed(8));

                // Add to history log
                addToHistory(currentInput, result);

                currentInput = result.toString();
                evaluated = true;
                updateDisplay();

            } catch (error) {
                currentInput = "Error";
                updateDisplay();
                setTimeout(() => {
                    currentInput = "0";
                    updateDisplay();
                }, 1500);
            }
        }

        // Add history entry
        function addToHistory(expr, res) {
            calculationHistory.unshift({ expr, res });
            if (calculationHistory.length > 20) calculationHistory.pop();
            renderHistory();
        }

        // Render history list
        function renderHistory() {
            if (calculationHistory.length === 0) {
                historyList.innerHTML = '<div class="text-center text-gray-500 py-12 text-xs italic">No history yet</div>';
                return;
            }

            historyList.innerHTML = calculationHistory.map((item, idx) => `
                <div onclick="loadHistoryItem('${item.res}')" class="p-2.5 rounded-xl bg-white/5 border border-white/5 hover:bg-white/10 cursor-pointer transition flex flex-col">
                    <span class="text-xs text-gray-400 font-mono">${item.expr}</span>
                    <span class="text-sm font-semibold text-purple-300 text-right font-mono">= ${item.res}</span>
                </div>
            `).join('');
        }

        // Load past result back into calculator
        function loadHistoryItem(val) {
            currentInput = val.toString();
            evaluated = false;
            updateDisplay();
        }

        // Clear history log
        function clearHistory() {
            calculationHistory = [];
            renderHistory();
        }

        // Keyboard Support
        window.addEventListener("keydown", (e) => {
            if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
                appendValue(e.key);
            } else if (['+', '-', '*', '/'].includes(e.key)) {
                appendOperator(e.key);
            } else if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calculateResult();
            } else if (e.key === 'Backspace') {
                backspace();
            } else if (e.key === 'Escape') {
                clearAll();
            } else if (e.key === '%') {
                appendValue('%');
            }
        });
    </script>
</body>
</html>
