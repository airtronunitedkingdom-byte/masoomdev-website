<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Combine multiple PDF documents in the order you choose."><title>PDF Merge | MasoomDev</title><link rel="stylesheet" href="/assets/tool-shared.css"><style>.files{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%}small{color:#766b85}</style></head><body><header><a href="/tools/pdf-file-tools/">← PDF & File Tools</a></header><main><h1>PDF Merge</h1><p>Combine multiple PDF documents in the order you choose. Your files are processed locally in your browser.</p><section class="panel"><label class="field">Select PDF files (multiple)<input id="files" type="file" accept="application/pdf,.pdf" multiple></label><div id="list" class="files"></div><button id="run">Merge PDFs</button><p id="status" role="status"></p></section><p><small>PDF and ZIP libraries may require internet access to load initially.</small></p></main><footer>MasoomDev • PDF & File Tools</footer><script src="/assets/tool-shared.js"></script><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id);let files=[];function render(){const root=$('list');root.replaceChildren();files.forEach((f,i)=>{const row=document.createElement('div');row.className='controls';const name=document.createElement('span');name.textContent=(i+1)+'. '+f.name+' ('+MDTools.formatBytes(f.size)+')';row.append(name);for(const [label,j] of [['↑',i-1],['↓',i+1]]){const b=document.createElement('button');b.textContent=label;b.disabled=j<0||j>=files.length;b.onclick=()=>{[files[i],files[j]]=[files[j],files[i]];render()};row.append(b)}const remove=document.createElement('button');remove.textContent='Remove';remove.onclick=()=>{files.splice(i,1);render()};row.append(remove);root.append(row)})}$('files').onchange=()=>{files.push(...Array.from($('files').files));$('files').value='';render()};$('run').onclick=async()=>{if(!window.PDFLib){$('status').textContent='PDF library unavailable. Check internet connection.';return}if(files.length<2){$('status').textContent='Select at least two PDFs.';return}try{$('run').disabled=true;$('status').textContent='Merging…';const out=await PDFLib.PDFDocument.create();for(const f of files){if(f.size>50*1048576)throw Error('Each PDF must be 50 MB or less.');const doc=await PDFLib.PDFDocument.load(await f.arrayBuffer());const pages=await out.copyPages(doc,doc.getPageIndices());pages.forEach(p=>out.addPage(p))}MDTools.download(new Blob([await out.save()],{type:'application/pdf'}),'merged.pdf');$('status').textContent='Merged '+files.length+' PDFs.'}catch(e){$('status').textContent='Could not merge PDFs: '+e.message}finally{$('run').disabled=false}}})();</script></body></html>
