<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Convert an image to a Base64 data URL for development or embedding."><title>Image to Base64 | MasoomDev</title><link rel="stylesheet" href="/assets/tool-shared.css"><link rel="manifest" href="/manifest.webmanifest"><style>canvas{max-width:100%;height:auto;border:1px solid #b9adcb;border-radius:9px;touch-action:none}.hint{font-size:.9rem;color:#736586}</style></head><body><header><a href="/tools/image-tools/">← Image Tools</a></header><main><h1>Image to Base64</h1><p>Convert an image to a Base64 data URL for development or embedding. Processing stays on your device.</p><section class="panel"><label class="field">Choose image (max 5 MB)<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><p id="status" role="status"></p><textarea id="output" readonly rows="9" style="width:100%;font:12px monospace" aria-label="Base64 data URL"></textarea><div class="controls"><button id="copy" disabled>Copy Base64</button><button id="save" disabled>Download TXT</button></div></section></main><footer>MasoomDev • Free browser tools</footer><script src="/assets/tool-shared.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id);$('file').addEventListener('change',()=>{const f=$('file').files[0];$('output').value='';$('copy').disabled=$('save').disabled=true;if(!f)return;if(!/^image\/(png|jpeg|webp|gif)$/.test(f.type)||f.size>5*1048576){$('status').textContent='Select a supported image under 5 MB.';return}const r=new FileReader();r.onload=()=>{$('output').value=r.result;$('status').textContent='Encoded '+MDTools.formatBytes(f.size)+'.';$('copy').disabled=$('save').disabled=false};r.onerror=()=>{$('status').textContent='Failed to read image.'};r.readAsDataURL(f)});$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('output').value);$('status').textContent='Copied.'}catch(e){$('output').select();$('status').textContent='Select and copy the text manually.'}});$('save').addEventListener('click',()=>MDTools.download(new Blob([$('output').value],{type:'text/plain'}),'image-base64.txt'))})();</script></body></html>
