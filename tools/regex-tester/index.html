<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Test JavaScript regular expressions and highlight matches."><title>Regex Tester | MasoomDev</title><link rel="stylesheet" href="/assets/tool-shared.css"><style>textarea{width:100%;min-height:150px;font:14px ui-monospace,monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere}mark{background:#ffe68b;color:#181818}.preview{white-space:normal;overflow-wrap:anywhere;max-height:none}code{overflow-wrap:anywhere}</style></head><body><header><a href="/tools/">← HTML Tools</a></header><main><h1>Regex Tester</h1><p>Test JavaScript regular expressions and highlight matches. Processing runs locally in your browser.</p><section class="panel"><div class="controls"><label class="field">Regular expression<input id="pattern" placeholder="e.g. [a-z]+"></label><label class="field">Flags<input id="flags" value="gi" placeholder="gimsuyd"></label></div><label class="field">Test text<textarea id="input" placeholder="Paste text to test"></textarea></label><p id="status" role="status"></p><div class="panel"><strong>Matches</strong><pre id="matches"></pre></div></section></main><footer>MasoomDev • Free Developer Tools</footer><script src="/assets/tool-shared.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id);function run(){const p=$('pattern').value,flags=$('flags').value,s=$('input').value,out=$('matches');out.replaceChildren();if(!p){$('status').textContent='Enter a pattern.';return}try{const re=new RegExp(p,flags.includes('g')?flags:flags+'g');let m,count=0,last=0;while((m=re.exec(s))!==null&&count<500){out.appendChild(document.createTextNode(s.slice(last,m.index)));const mark=document.createElement('mark');mark.textContent=m[0]||'∅';out.appendChild(mark);last=m.index+m[0].length;count++;if(m[0].length===0){if(re.lastIndex>=s.length)break;re.lastIndex++}}out.appendChild(document.createTextNode(s.slice(last)));$('status').textContent=count+' match(es)'+(count===500?' (display limited to 500)':'')}catch(e){$('status').textContent='Invalid expression: '+e.message}}['pattern','flags','input'].forEach(id=>$(id).addEventListener('input',run));run()})();</script></body></html>
