<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Convert UTF-8 text to and from Base64."><title>Base64 Encoder & Decoder | MasoomDev</title><link rel="stylesheet" href="/assets/tool-shared.css"><style>textarea{width:100%;min-height:150px;font:14px ui-monospace,monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere}mark{background:#ffe68b;color:#181818}.preview{white-space:normal;overflow-wrap:anywhere;max-height:none}code{overflow-wrap:anywhere}</style></head><body><header><a href="/tools/">← HTML Tools</a></header><main><h1>Base64 Encoder & Decoder</h1><p>Convert UTF-8 text to and from Base64. Processing runs locally in your browser.</p><section class="panel"><label class="field">Input<textarea id="input" placeholder="Enter text or Base64"></textarea></label><div class="controls"><button id="encode">Encode to Base64</button><button id="decode">Decode Base64</button><button id="swap">Use output as input</button></div><p id="status" role="status"></p><label class="field">Output<textarea id="output" readonly></textarea></label><button id="copy">Copy output</button></section></main><footer>MasoomDev • Free Developer Tools</footer><script src="/assets/tool-shared.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id);$('encode').onclick=()=>{try{const bytes=new TextEncoder().encode($('input').value);let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode(...bytes.subarray(i,i+8192));$('output').value=btoa(bin);$('status').textContent='Encoded.'}catch(e){$('status').textContent=e.message}};$('decode').onclick=()=>{try{const bin=atob($('input').value.trim()),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));$('output').value=new TextDecoder('utf-8',{fatal:true}).decode(bytes);$('status').textContent='Decoded.'}catch(e){$('status').textContent='Invalid Base64 or UTF-8 data.'}};$('swap').onclick=()=>{$('input').value=$('output').value};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('output').value);$('status').textContent='Copied.'}catch(e){$('output').select();$('status').textContent='Select and copy manually.'}}})();</script></body></html>
