<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Pick exact pixel colors from an uploaded image and copy HEX or RGB values."><title>Image Color Picker | MasoomDev</title><link rel="stylesheet" href="/assets/tool-shared.css"><link rel="manifest" href="/manifest.webmanifest"><style>canvas{max-width:100%;height:auto;border:1px solid #b9adcb;border-radius:9px;touch-action:none}.hint{font-size:.9rem;color:#736586}</style></head><body><header><a href="/tools/image-tools/">← Image Tools</a></header><main><h1>Image Color Picker</h1><p>Pick exact pixel colors from an uploaded image and copy HEX or RGB values. Processing stays on your device.</p><section class="panel"><label class="field">Image<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><p class="hint">Click or tap anywhere on the image to sample a color.</p><canvas id="canvas" width="1" height="1" aria-label="Image color sampling canvas"></canvas><div class="controls"><label class="field">HEX<input id="hex" readonly></label><label class="field">RGB<input id="rgb" readonly></label><label class="field">Sampled color<input id="color" type="color" disabled value="#ffffff"></label><button id="copy" disabled>Copy HEX</button></div><p id="status" role="status"></p></section></main><footer>MasoomDev • Free browser tools</footer><script src="/assets/tool-shared.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});$('file').addEventListener('change',async()=>{try{const img=await MDTools.loadImage($('file').files[0]);if(img.naturalWidth*img.naturalHeight>40000000)throw Error('Maximum 40 megapixels');c.width=img.naturalWidth;c.height=img.naturalHeight;ctx.drawImage(img,0,0);$('status').textContent='Click image to pick a color.'}catch(e){$('status').textContent=e.message}});c.addEventListener('click',e=>{if(c.width<2)return;const r=c.getBoundingClientRect(),x=Math.min(c.width-1,Math.max(0,Math.floor((e.clientX-r.left)*c.width/r.width))),y=Math.min(c.height-1,Math.max(0,Math.floor((e.clientY-r.top)*c.height/r.height))),d=ctx.getImageData(x,y,1,1).data;const hex='#'+[d[0],d[1],d[2]].map(n=>n.toString(16).padStart(2,'0')).join('').toUpperCase();$('hex').value=hex;$('rgb').value='rgb('+d[0]+', '+d[1]+', '+d[2]+')';$('color').value=hex;$('copy').disabled=false;$('status').textContent='Pixel: '+x+', '+y});$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('hex').value);$('status').textContent='HEX copied.'}catch(e){$('hex').select();$('status').textContent='Select and copy HEX manually.'}})})();</script></body></html>
