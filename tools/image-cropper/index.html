<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Crop images visually using a draggable selection box, then download the result."><title>Image Cropper | MasoomDev</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/assets/tool-shared.css"><style>canvas{max-width:100%;height:auto;border:1px solid #a99abf;touch-action:none;cursor:crosshair}.hint{color:#736586}html[data-md-theme=dark] .hint{color:#c9bbdf}</style></head><body><header><a href="/tools/">← HTML Tools</a></header><main><h1>Image Cropper</h1><p>Crop images visually using a draggable selection box, then download the result. Files stay on your device.</p><section class="panel"><div class="controls"><label class="field">Choose image<input type="file" id="file" accept="image/jpeg,image/png,image/webp"></label><label class="field">Aspect ratio<select id="aspect"><option value="free">Free</option><option value="1">Square 1:1</option><option value="1.7777777778">Landscape 16:9</option><option value="0.75">Portrait 3:4</option></select></label><label class="field">Output<select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></label></div><p class="hint">Drag on the image to select the crop area. On mobile, drag with your finger.</p><canvas id="canvas" aria-label="Image crop selection" width="1" height="1"></canvas><div class="controls"><button id="run" disabled>Crop selection</button></div><p id="status" role="status"></p></section><section class="panel" id="result" hidden><h2>Cropped image</h2><img id="preview" class="preview" alt="Cropped result"><p id="sizes"></p><button id="save">Download cropped image</button></section></main><footer>MasoomDev • Private browser processing</footer><script src="/assets/tool-shared.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');let img=null,selection=null,start=null,blob=null,url=null;const status=$('status');function draw(){if(!img)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);if(selection&&selection.w>0&&selection.h>0){ctx.fillStyle='rgba(0,0,0,.38)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,selection.x,selection.y,selection.w,selection.h,selection.x,selection.y,selection.w,selection.h);ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(2,canvas.width/450);ctx.setLineDash([10,6]);ctx.strokeRect(selection.x,selection.y,selection.w,selection.h);ctx.setLineDash([])}}function pos(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(canvas.width,Math.round((e.clientX-r.left)*canvas.width/r.width))),y:Math.max(0,Math.min(canvas.height,Math.round((e.clientY-r.top)*canvas.height/r.height)))}}function update(e){if(!start)return;const p=pos(e),dx=p.x-start.x,dy=p.y-start.y;let w=Math.abs(dx),h=Math.abs(dy);const ratio=Number($('aspect').value);if(ratio>0&&w&&h){if(w/h>ratio)w=h*ratio;else h=w/ratio}w=Math.min(Math.round(w),dx<0?start.x:canvas.width-start.x);h=Math.min(Math.round(h),dy<0?start.y:canvas.height-start.y);selection={x:Math.round(dx<0?start.x-w:start.x),y:Math.round(dy<0?start.y-h:start.y),w,h};draw()}canvas.addEventListener('pointerdown',e=>{if(!img)return;start=pos(e);selection=null;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(start)update(e)});canvas.addEventListener('pointerup',e=>{if(start){update(e);start=null;status.textContent=selection&&selection.w&&selection.h?'Selected: '+selection.w+' × '+selection.h:'Drag to select an area.'}});canvas.addEventListener('pointercancel',()=>{start=null});$('aspect').addEventListener('change',()=>{selection=null;draw()});$('file').addEventListener('change',async()=>{img=null;selection=null;$('run').disabled=true;$('result').hidden=true;try{img=await MDTools.loadImage($('file').files[0]);if(img.naturalWidth*img.naturalHeight>40000000)throw Error('Maximum 40 megapixels.');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;draw();$('run').disabled=false;status.textContent='Drag to select a crop area.'}catch(e){status.textContent=e.message}});$('run').addEventListener('click',async()=>{if(!img||!selection||selection.w<1||selection.h<1){status.textContent='Select an area first.';return}try{const c=document.createElement('canvas');c.width=selection.w;c.height=selection.h;const x=c.getContext('2d');if($('format').value==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(img,selection.x,selection.y,selection.w,selection.h,0,0,c.width,c.height);blob=await MDTools.canvasBlob(c,$('format').value,.92);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);$('preview').src=url;$('sizes').textContent=c.width+' × '+c.height+' • '+MDTools.formatBytes(blob.size);$('result').hidden=false;status.textContent='Crop ready.'}catch(e){status.textContent=e.message}});$('save').addEventListener('click',()=>{if(blob){const ext=$('format').value==='image/jpeg'?'jpg':$('format').value.split('/')[1];MDTools.download(blob,($('file').files[0]?.name||'image').replace(/\.[^.]+$/,'')+'-cropped.'+ext)}});window.addEventListener('pagehide',()=>{if(url)URL.revokeObjectURL(url)})})();</script></body></html>
