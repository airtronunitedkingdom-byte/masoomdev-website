<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10 Quick Tools | MasoomDev</title><style>body{font:16px system-ui;background:#f8f7fc;color:#25203b;margin:0}main{max-width:1050px;margin:auto;padding:25px 16px 90px}h1{margin-bottom:5px}.intro{color:#625c72}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:15px}.tool{background:white;border:1px solid #ddd5ed;border-radius:15px;padding:18px;min-width:0}textarea,input,select{box-sizing:border-box;width:100%;padding:10px;margin:6px 0;border:1px solid #bcb0d4;border-radius:8px;font:inherit}textarea{min-height:90px;resize:vertical}button{background:#6540bd;color:white;border:0;border-radius:9px;padding:10px 14px;cursor:pointer;margin:5px 5px 5px 0}button:focus-visible{outline:3px solid #9a78ec}output,pre{display:block;white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f0fb;border-radius:8px;padding:10px;min-height:22px;margin-top:8px}small{color:#675d77}a{color:#5d39aa}</style><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md-pwa.js" defer></script></head><body><main><p><a href="/tools/">← All tools</a></p><h1>10 Quick Tools</h1><p class="intro">Free, private, browser-based utilities. Text stays on your device.</p><div class="grid" id="grid"></div></main><script>
const specs=[
['JSON Formatter','Paste JSON','Format','{"hello":"world"}'],
['Text Case Converter','Paste text','Convert','Hello World'],
['URL Slug Generator','Enter a title','Create slug','My First Article!'],
['Unix Timestamp','Enter date or timestamp','Convert','2026-11-02'],
['Color Contrast Checker','Enter two hex colors separated by a comma','Check','#ffffff,#6540bd'],
['Text Difference','Enter two texts separated by a line containing ---','Compare','hello world\n---\nhello there'],
['CSV to JSON','Paste CSV (first row headers)','Convert','name,age\nAlex,25'],
['Lorem Ipsum Generator','Number of paragraphs (1–10)','Generate','3'],
['Line Sorter & Deduplicator','Paste lines','Process','orange\napple\norange'],
['SHA-256 Hash','Enter text','Generate hash','MasoomDev']
];const grid=document.getElementById('grid');specs.forEach((s,i)=>{const section=document.createElement('section');section.className='tool';const h=document.createElement('h2');h.textContent=s[0];const lab=document.createElement('label');lab.textContent=s[1];const field=document.createElement('textarea');field.value=s[3];lab.appendChild(field);const action=document.createElement('button');action.textContent=s[2];const copy=document.createElement('button');copy.textContent='Copy result';const result=document.createElement('output');result.setAttribute('aria-live','polite');action.onclick=async()=>{try{const v=field.value;let out='';switch(i){case 0:out=JSON.stringify(JSON.parse(v),null,2);break;case 1:out='UPPER: '+v.toUpperCase()+'\nLOWER: '+v.toLowerCase()+'\nTitle: '+v.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());break;case 2:out=v.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');break;case 3:{const n=/^\d{10,13}$/.test(v.trim())?new Date(Number(v.trim())*(v.trim().length===10?1000:1)):new Date(v);if(Number.isNaN(n.getTime()))throw Error('Invalid date or timestamp');out='ISO: '+n.toISOString()+'\nUnix seconds: '+Math.floor(n.getTime()/1000)+'\nLocal: '+n.toLocaleString();break}case 4:{const [x,y]=v.split(',').map(s=>s.trim());const lum=h=>{if(!/^#[0-9a-f]{6}$/i.test(h))throw Error('Use two 6-digit hex colors');const rgb=[1,3,5].map(n=>parseInt(h.slice(n,n+2),16)/255).map(c=>c<=.04045?c/12.92:((c+.055)/1.055)**2.4);return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722};const z=[lum(x),lum(y)].sort((a,b)=>b-a),ratio=(z[0]+.05)/(z[1]+.05);out='Contrast: '+ratio.toFixed(2)+':1\nNormal text AA: '+(ratio>=4.5?'PASS':'FAIL')+'\nLarge text AA: '+(ratio>=3?'PASS':'FAIL');break}case 5:{const parts=v.split(/^---\s*$/m);if(parts.length!==2)throw Error('Separate texts with --- on its own line');const aa=parts[0].trim().split(/\s+/),bb=parts[1].trim().split(/\s+/);out='Removed: '+aa.filter(x=>!bb.includes(x)).join(' ')+'\nAdded: '+bb.filter(x=>!aa.includes(x)).join(' ');break}case 6:{const rows=v.trim().split(/\r?\n/).map(line=>{const matches=line.match(/("(?:[^"]|"")*"|[^,]*)(,|$)/g)||[];return matches.map(x=>x.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"')).slice(0,-(line.endsWith(',')?0:1)||undefined)});const heads=rows.shift();out=JSON.stringify(rows.filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(heads.map((h,j)=>[h,r[j]||'']))),null,2);break}case 7:{const n=Math.max(1,Math.min(10,Number(v)||1));out=Array.from({length:n},()=> 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer euismod, sapien a facilisis tempor, velit eros bibendum nisl, vitae blandit justo nibh at nisi.').join('\n\n');break}case 8:out=[...new Set(v.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b)).join('\n');break;case 9:{if(!crypto.subtle)throw Error('Secure context required (localhost or HTTPS)');const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));out=Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('');break}}result.textContent=out||'(empty result)'}catch(e){result.textContent='Error: '+e.message}};copy.onclick=()=>navigator.clipboard.writeText(result.textContent).then(()=>{copy.textContent='Copied!';setTimeout(()=>copy.textContent='Copy result',1200)}).catch(()=>{copy.textContent='Copy unavailable'});section.append(h,lab,action,copy,result);grid.append(section)});
</script></body></html>
