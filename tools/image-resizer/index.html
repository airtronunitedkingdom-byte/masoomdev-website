<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Resize JPG, PNG and WebP images to custom dimensions, with optional aspect ratio lock."><title>Image Resizer | MasoomDev</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/assets/tool-shared.css"><style>canvas{max-width:100%;height:auto;border:1px solid #a99abf;touch-action:none;cursor:crosshair}.hint{color:#736586}html[data-md-theme=dark] .hint{color:#c9bbdf}</style></head><body><header><a href="/tools/">← HTML Tools</a></header><main><h1>Image Resizer</h1><p>Resize JPG, PNG and WebP images to custom dimensions, with optional aspect ratio lock. Files stay on your device.</p><section class="panel"><div class="controls"><label class="field">Image<input type="file" id="file" accept="image/jpeg,image/png,image/webp"></label><label class="field">Width (px)<input id="width" type="number" min="1" max="12000"></label><label class="field">Height (px)<input id="height" type="number" min="1" max="12000"></label><label class="field">Output format<select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></label></div><div class="controls"><label><input id="lock" type="checkbox" checked> Lock aspect ratio</label><button id="run" disabled>Resize</button></div><p class="status" id="status" role="status"></p></section><section class="panel" id="result" hidden><h2>Result</h2><img id="preview" class="preview" alt="Resized image"><p id="sizes"></p><button id="save">Download resized image</button></section></main><footer>MasoomDev • Private browser processing</footer><script src="/assets/tool-shared.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id);let img=null,blob=null,url=null,ratio=1;const w=$('width'),h=$('height'),lock=$('lock'),status=$('status');$('file').addEventListener('change',async()=>{img=null;blob=null;$('result').hidden=true;$('run').disabled=true;try{img=await MDTools.loadImage($('file').files[0]);ratio=img.naturalWidth/img.naturalHeight;w.value=img.naturalWidth;h.value=img.naturalHeight;$('run').disabled=false;status.textContent='Original: '+w.value+' × '+h.value+' pixels'}catch(e){status.textContent=e.message}});w.addEventListener('input',()=>{if(lock.checked&&ratio&&Number(w.value)>0)h.value=Math.max(1,Math.round(Number(w.value)/ratio))});h.addEventListener('input',()=>{if(lock.checked&&ratio&&Number(h.value)>0)w.value=Math.max(1,Math.round(Number(h.value)*ratio))});$('run').addEventListener('click',async()=>{const x=Number(w.value),y=Number(h.value);if(!img||!Number.isInteger(x)||!Number.isInteger(y)||x<1||y<1||x>12000||y>12000||x*y>40000000){status.textContent='Enter valid dimensions (up to 40 megapixels).';return}try{status.textContent='Resizing…';const canvas=document.createElement('canvas');canvas.width=x;canvas.height=y;const ctx=canvas.getContext('2d');if($('format').value==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,x,y)}ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,x,y);blob=await MDTools.canvasBlob(canvas,$('format').value,.9);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);$('preview').src=url;$('sizes').textContent=x+' × '+y+' • '+MDTools.formatBytes(blob.size);$('result').hidden=false;status.textContent='Ready'}catch(e){status.textContent=e.message}});$('save').addEventListener('click',()=>{if(blob){const ext=$('format').value==='image/jpeg'?'jpg':$('format').value.split('/')[1];MDTools.download(blob,($('file').files[0]?.name||'image').replace(/\.[^.]+$/,'')+'-resized.'+ext)}});window.addEventListener('pagehide',()=>{if(url)URL.revokeObjectURL(url)})})();</script></body></html>
