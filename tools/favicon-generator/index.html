<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Generate website favicon PNG images in 16×16, 32×32, 48×48, 180×180 and 192×192 sizes."><title>Favicon Generator | MasoomDev</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/assets/tool-shared.css"><style>.preview-wrap{overflow:auto;text-align:center;background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 50%/20px 20px;border-radius:12px;padding:12px}canvas{max-width:100%;height:auto}.status{color:#55456c}</style></head><body><header><a href="/tools/">← HTML Tools</a></header><main><h1>Favicon Generator</h1><p>Generate website favicon PNG images in 16×16, 32×32, 48×48, 180×180 and 192×192 sizes. All processing stays in your browser.</p><section class="panel"><div class="controls"><label class="field">Choose logo/image<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><label class="field">Background<select id="background"><option value="transparent">Transparent (PNG)</option><option value="#ffffff">White</option><option value="#241044">Purple</option></select></label><label class="field">Image fit<select id="fit"><option value="contain">Contain full image</option><option value="cover">Fill square (crop edges)</option></select></label><button id="generate" disabled>Generate favicon sizes</button></div><p class="status" id="status" role="status"></p></section><section class="panel" id="result" hidden><h2>Download favicon sizes</h2><div id="downloads" class="controls"></div><p>Tip: Use favicon-32x32.png in your website HTML with a favicon link tag.</p></section></main><footer>MasoomDev • Browser-only processing</footer><script src="/assets/tool-shared.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),status=$('status');let img=null;let items=[];$('file').addEventListener('change',async()=>{img=null;$('generate').disabled=true;$('result').hidden=true;try{img=await MDTools.loadImage($('file').files[0]);if(img.naturalWidth*img.naturalHeight>40000000)throw Error('Maximum 40 megapixels.');$('generate').disabled=false;status.textContent='Image loaded. Generate the favicon files.'}catch(e){status.textContent=e.message}});$('generate').addEventListener('click',async()=>{if(!img)return;const area=$('downloads');area.replaceChildren();items=[];$('result').hidden=true;try{for(const size of [16,32,48,180,192]){const c=document.createElement('canvas');c.width=c.height=size;const ctx=c.getContext('2d');if($('background').value!=='transparent'){ctx.fillStyle=$('background').value;ctx.fillRect(0,0,size,size)}const iw=img.naturalWidth,ih=img.naturalHeight,scale=$('fit').value==='cover'?Math.max(size/iw,size/ih):Math.min(size/iw,size/ih),w=iw*scale,h=ih*scale;ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);const blob=await MDTools.canvasBlob(c,'image/png');items.push({size,blob});const b=document.createElement('button');b.textContent='Download '+size+'×'+size;b.addEventListener('click',()=>MDTools.download(blob,'favicon-'+size+'x'+size+'.png'));area.appendChild(b)}$('result').hidden=false;status.textContent='Generated '+items.length+' PNG sizes.'}catch(e){status.textContent=e.message}})})();</script></body></html>
