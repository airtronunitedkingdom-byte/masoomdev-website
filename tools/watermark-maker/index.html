<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Add a customizable text watermark to JPG, PNG or WebP images."><title>Watermark Maker | MasoomDev</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/assets/tool-shared.css"><style>.preview-wrap{overflow:auto;text-align:center;background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 50%/20px 20px;border-radius:12px;padding:12px}canvas{max-width:100%;height:auto}.status{color:#55456c}</style></head><body><header><a href="/tools/">← HTML Tools</a></header><main><h1>Watermark Maker</h1><p>Add a customizable text watermark to JPG, PNG or WebP images. All processing stays in your browser.</p><section class="panel"><div class="controls"><label class="field">Choose image<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><label class="field">Watermark text<input id="text" type="text" maxlength="100" value="© MasoomDev"></label><label class="field">Position<select id="position"><option value="br">Bottom right</option><option value="bl">Bottom left</option><option value="tr">Top right</option><option value="tl">Top left</option><option value="center">Center</option></select></label><label class="field">Text color<input id="color" type="color" value="#ffffff"></label></div><div class="controls"><label class="field">Font size (% of image width)<input id="size" type="range" min="2" max="12" value="5"></label><label class="field">Opacity<input id="opacity" type="range" min="10" max="100" value="75"></label><label class="field">Export<select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></label><button id="apply" disabled>Apply watermark</button></div><p class="status" id="status" role="status"></p></section><section class="panel" id="result" hidden><h2>Watermarked preview</h2><div class="preview-wrap"><canvas id="canvas" width="1" height="1"></canvas></div><p id="info"></p><button id="save">Download image</button></section></main><footer>MasoomDev • Browser-only processing</footer><script src="/assets/tool-shared.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');let img=null,blob=null;const status=$('status');$('file').addEventListener('change',async()=>{img=null;blob=null;$('result').hidden=true;$('apply').disabled=true;try{img=await MDTools.loadImage($('file').files[0]);if(img.naturalWidth*img.naturalHeight>40000000)throw Error('Maximum 40 megapixels.');$('apply').disabled=false;status.textContent='Image loaded: '+img.naturalWidth+' × '+img.naturalHeight}catch(e){status.textContent=e.message}});$('apply').addEventListener('click',async()=>{if(!img)return;try{const text=$('text').value.trim();if(!text)throw Error('Enter watermark text.');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;ctx.clearRect(0,0,canvas.width,canvas.height);if($('format').value==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height)}ctx.drawImage(img,0,0);const fontSize=Math.max(12,Math.round(canvas.width*Number($('size').value)/100));ctx.font='bold '+fontSize+'px system-ui,Arial';ctx.textBaseline='middle';const pad=Math.max(12,Math.round(fontSize*.55)),maxWidth=canvas.width-pad*2;const pos=$('position').value;let x=pad,y=pad+fontSize/2;ctx.textAlign='left';if(pos==='br'||pos==='tr'){x=canvas.width-pad;ctx.textAlign='right'}if(pos==='center'){x=canvas.width/2;y=canvas.height/2;ctx.textAlign='center'}else if(pos==='br'||pos==='bl')y=canvas.height-pad-fontSize/2;ctx.globalAlpha=Number($('opacity').value)/100;ctx.fillStyle=$('color').value;ctx.shadowColor='rgba(0,0,0,.65)';ctx.shadowBlur=Math.max(2,fontSize/8);ctx.fillText(text,x,y,maxWidth);ctx.globalAlpha=1;ctx.shadowBlur=0;blob=await MDTools.canvasBlob(canvas,$('format').value,.92);$('result').hidden=false;$('info').textContent=canvas.width+' × '+canvas.height+' • '+MDTools.formatBytes(blob.size);status.textContent='Watermark applied.'}catch(e){status.textContent=e.message}});$('save').addEventListener('click',()=>{if(!blob)return;const ext=$('format').value==='image/jpeg'?'jpg':$('format').value.split('/')[1];MDTools.download(blob,($('file').files[0]?.name||'image').replace(/\.[^.]+$/,'')+'-watermarked.'+ext)})})();</script></body></html>
