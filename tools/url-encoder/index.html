<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Encode or decode URL text and query parameters."><title>URL Encoder & Decoder | MasoomDev</title><link rel="stylesheet" href="/assets/tool-shared.css"><style>textarea{width:100%;min-height:150px;font:14px ui-monospace,monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere}mark{background:#ffe68b;color:#181818}.preview{white-space:normal;overflow-wrap:anywhere;max-height:none}code{overflow-wrap:anywhere}</style></head><body><header><a href="/tools/">← HTML Tools</a></header><main><h1>URL Encoder & Decoder</h1><p>Encode or decode URL text and query parameters. Processing runs locally in your browser.</p><section class="panel"><label class="field">Input text<textarea id="input" placeholder="Enter URL or text"></textarea></label><div class="controls"><label class="field">Mode<select id="mode"><option value="component">Query parameter / component</option><option value="uri">Full URL (preserve URL separators)</option></select></label><button id="encode">Encode</button><button id="decode">Decode</button><button id="swap">Use output as input</button></div><p id="status" role="status"></p><label class="field">Output<textarea id="output" readonly></textarea></label><button id="copy">Copy output</button></section></main><footer>MasoomDev • Free Developer Tools</footer><script src="/assets/tool-shared.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id);function run(mode){try{const s=$('input').value,component=$('mode').value==='component';$('output').value=mode==='encode'?(component?encodeURIComponent(s):encodeURI(s)):(component?decodeURIComponent(s):decodeURI(s));$('status').textContent='Ready.'}catch(e){$('status').textContent='Invalid URL encoding: '+e.message}}$('encode').onclick=()=>run('encode');$('decode').onclick=()=>run('decode');$('swap').onclick=()=>{$('input').value=$('output').value};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('output').value);$('status').textContent='Copied.'}catch(e){$('output').select();$('status').textContent='Select and copy manually.'}}})();</script></body></html>
