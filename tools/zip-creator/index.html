<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Package multiple files into one downloadable ZIP archive."><title>ZIP Creator | MasoomDev</title><link rel="stylesheet" href="/assets/tool-shared.css"><style>.files{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%}small{color:#766b85}</style></head><body><header><a href="/tools/pdf-file-tools/">← PDF & File Tools</a></header><main><h1>ZIP Creator</h1><p>Package multiple files into one downloadable ZIP archive. Your files are processed locally in your browser.</p><section class="panel"><label class="field">Select files<input id="files" type="file" multiple></label><label class="field">ZIP filename<input id="name" value="my-files" maxlength="100"></label><label class="field">Compression<select id="level"><option value="0">Store (fast)</option><option value="3">Normal</option><option value="6" selected>Balanced</option><option value="9">Maximum</option></select></label><button id="run">Create ZIP</button><p id="status" role="status"></p></section><p><small>PDF and ZIP libraries may require internet access to load initially.</small></p></main><footer>MasoomDev • PDF & File Tools</footer><script src="/assets/tool-shared.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id);$('run').onclick=async()=>{const files=Array.from($('files').files);if(!files.length){$('status').textContent='Select files.';return}if(!window.JSZip){$('status').textContent='ZIP library unavailable. Check internet connection.';return}try{$('run').disabled=true;const zip=new JSZip(),used=new Set();for(const f of files){let name=f.name,n=1;while(used.has(name)){const dot=f.name.lastIndexOf('.');name=(dot>0?f.name.slice(0,dot):f.name)+'-'+n+++(dot>0?f.name.slice(dot):'')}used.add(name);zip.file(name,f)}const level=Number($('level').value),blob=await zip.generateAsync({type:'blob',compression:level?'DEFLATE':'STORE',compressionOptions:{level}},m=>{$('status').textContent='Compressing '+Math.round(m.percent)+'%'});MDTools.download(blob,($('name').value.replace(/[^a-z0-9 _-]/gi,'').trim()||'my-files')+'.zip');$('status').textContent='ZIP ready: '+MDTools.formatBytes(blob.size)}catch(e){$('status').textContent=e.message}finally{$('run').disabled=false}}})();</script></body></html>
