<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create, view and extract ZIP files directly in your browser."><title>ZIP Manager | MasoomDev</title><link rel="stylesheet" href="/assets/tool-shared.css"><style>.files{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%}small{color:#766b85}</style></head><body><header><a href="/tools/pdf-file-tools/">← PDF & File Tools</a></header><main><h1>ZIP Manager</h1><p>Package multiple files into one downloadable ZIP archive. Your files are processed locally in your browser.</p><section class="panel"><label class="field">Select files<input id="files" type="file" multiple></label><label class="field">ZIP filename<input id="name" value="my-files" maxlength="100"></label><label class="field">Compression<select id="level"><option value="0">Store (fast)</option><option value="3">Normal</option><option value="6" selected>Balanced</option><option value="9">Maximum</option></select></label><button id="run">Create ZIP</button><p id="status" role="status"></p></section><section class="panel"><h2>ZIP Viewer & Extractor</h2><label class="field">Open ZIP file<input id="archive" type="file" accept=".zip,application/zip"></label><p id="archive-status" role="status"></p><div id="entries" class="files"></div><section class="panel" id="preview-panel" hidden><h3>File Preview</h3><div id="preview-content"></div></section></section><p><small>PDF and ZIP libraries may require internet access to load initially.</small></p></main><footer>MasoomDev • PDF & File Tools</footer><script src="/assets/tool-shared.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id);$('run').onclick=async()=>{const files=Array.from($('files').files);if(!files.length){$('status').textContent='Select files.';return}if(!window.JSZip){$('status').textContent='ZIP library unavailable. Check internet connection.';return}try{$('run').disabled=true;const zip=new JSZip(),used=new Set();for(const f of files){let name=f.name,n=1;while(used.has(name)){const dot=f.name.lastIndexOf('.');name=(dot>0?f.name.slice(0,dot):f.name)+'-'+n+++(dot>0?f.name.slice(dot):'')}used.add(name);zip.file(name,f)}const level=Number($('level').value),blob=await zip.generateAsync({type:'blob',compression:level?'DEFLATE':'STORE',compressionOptions:{level}},m=>{$('status').textContent='Compressing '+Math.round(m.percent)+'%'});MDTools.download(blob,($('name').value.replace(/[^a-z0-9 _-]/gi,'').trim()||'my-files')+'.zip');$('status').textContent='ZIP ready: '+MDTools.formatBytes(blob.size)}catch(e){$('status').textContent=e.message}finally{$('run').disabled=false}}})();(()=>{const $=id=>document.getElementById(id);let zip=null,entries=[];$('archive').onchange=async()=>{zip=null;entries=[];$('entries').replaceChildren();$('extract-all').disabled=true;const file=$('archive').files[0];if(!file)return;try{if(!window.JSZip)throw Error('ZIP library not loaded.');if(file.size>100000000)throw Error('Maximum archive size 100 MB.');zip=await JSZip.loadAsync(file,{checkCRC32:true});entries=Object.values(zip.files).filter(e=>!e.dir);if(entries.length>500)throw Error('Maximum 500 files.');let total=0;for(const e of entries){const size=e._data?.uncompressedSize||0;if(size>100000000)throw Error('File exceeds 100 MB.');total+=size}if(total>300000000)throw Error('Uncompressed archive exceeds 300 MB.');for(const e of entries){const row=document.createElement('div');row.className='controls';const name=document.createElement('span');name.textContent=e.name+' ('+MDTools.formatBytes(e._data?.uncompressedSize||0)+')';name.style.overflowWrap='anywhere';const btn=document.createElement('button');btn.textContent='Extract';btn.onclick=async()=>{btn.disabled=true;try{const blob=await e.async('blob');if(blob.size>100000000)throw Error('File too large.');MDTools.download(blob,e.name.replaceAll('/','_').replaceAll('\\','_'));$('archive-status').textContent='Extracted '+e.name}catch(err){$('archive-status').textContent=err.message}finally{btn.disabled=false}};row.append(name,btn);$('entries').append(row)}$('extract-all').disabled=!entries.length;$('archive-status').textContent='Opened '+entries.length+' files.'}catch(err){zip=null;entries=[];$('entries').replaceChildren();$('archive-status').textContent=err.message}};$('extract-all').onclick=async()=>{if(!zip)return;const btn=$('extract-all');btn.disabled=true;try{const out=new JSZip();let total=0;for(const e of entries){const blob=await e.async('blob');total+=blob.size;if(total>300000000)throw Error('Size limit exceeded.');out.file(e.name,blob)}const blob=await out.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:3}});MDTools.download(blob,'extracted-files.zip');$('archive-status').textContent='All files packaged for download.'}catch(err){$('archive-status').textContent=err.message}finally{btn.disabled=false}}})();</script></body></html>
