<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Extract a page range or individual pages from a PDF."><title>PDF Split | MasoomDev</title><link rel="stylesheet" href="/assets/tool-shared.css"><style>.files{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%}small{color:#766b85}</style></head><body><header><a href="/tools/pdf-file-tools/">← PDF & File Tools</a></header><main><h1>PDF Split</h1><p>Extract a page range or individual pages from a PDF. Your files are processed locally in your browser.</p><section class="panel"><label class="field">Choose PDF<input id="file" type="file" accept="application/pdf,.pdf"></label><label class="field">Pages to extract (e.g. 1-3,5,8)<input id="pages" value="1" placeholder="1-3,5"></label><button id="run">Extract pages</button><p id="status" role="status"></p></section><p><small>PDF and ZIP libraries may require internet access to load initially.</small></p></main><footer>MasoomDev • PDF & File Tools</footer><script src="/assets/tool-shared.js"></script><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id);$('run').onclick=async()=>{const f=$('file').files[0];if(!f){$('status').textContent='Select a PDF.';return}if(!window.PDFLib){$('status').textContent='PDF library unavailable. Check internet connection.';return}try{$('run').disabled=true;const src=await PDFLib.PDFDocument.load(await f.arrayBuffer()),count=src.getPageCount(),indices=[];for(const part of $('pages').value.split(',')){const m=part.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)throw Error('Invalid page range.');const from=Number(m[1]),to=m[2]?Number(m[2]):from;if(from<1||to>count||to<from||to-from>1000)throw Error('Page range outside document or too large.');for(let i=from;i<=to;i++)indices.push(i-1)}if(!indices.length||indices.length>1000)throw Error('Select 1–1000 pages.');const out=await PDFLib.PDFDocument.create();(await out.copyPages(src,indices)).forEach(p=>out.addPage(p));MDTools.download(new Blob([await out.save()],{type:'application/pdf'}),'extracted-pages.pdf');$('status').textContent='Extracted '+indices.length+' pages from '+count+'.'}catch(e){$('status').textContent=e.message}finally{$('run').disabled=false}}})();</script></body></html>
