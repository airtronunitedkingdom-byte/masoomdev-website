<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Write Markdown with a live, safely rendered preview and export."><title>Markdown Editor | MasoomDev</title><link rel="stylesheet" href="/assets/tool-shared.css"><style>textarea{width:100%;min-height:220px;font:14px ui-monospace,monospace}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.output{min-height:220px;overflow-wrap:anywhere;overflow:auto;padding:15px;border:1px solid #b7a8d1;border-radius:9px}.output pre{white-space:pre-wrap}html[data-md-theme=dark] .output{color:#f5efff}@media(max-width:700px){.two{grid-template-columns:1fr}}</style></head><body><header><a href="/tools/developer-tools/">← Developer Tools</a></header><main><h1>Markdown Editor</h1><p>Write Markdown with a live, safely rendered preview and export. Everything runs locally in your browser.</p><section class="panel"><div class="controls"><button id="save">Download Markdown</button><button id="copy">Copy Markdown</button><button id="clear">Clear</button></div><div class="two"><label class="field">Markdown<textarea id="input" spellcheck="false" placeholder="# Hello world&#10;&#10;Write **bold** text and lists."></textarea></label><div><strong>Live preview</strong><div class="output" id="preview"></div></div></div><p id="status" role="status"></p></section></main><footer>MasoomDev • Developer Tools</footer><script src="/assets/tool-shared.js"></script><script src="/assets/md-desktop-mobile-nav.js" defer></script><script src="/assets/md2-foundation.js" defer></script><script src="/assets/md2-buddy.js" defer></script><script src="/assets/local-account.js" defer></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),input=$('input'),preview=$('preview');const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,t,u)=>'<a href="'+u.replace(/&amp;/g,'&amp;')+'" target="_blank" rel="noopener noreferrer">'+t+'</a>')}function render(){const lines=input.value.replace(/\r\n?/g,'\n').split('\n');let html='',list='',code=false,buf=[];function close(){if(list){html+='</'+list+'>';list=''}}for(const line of lines){if(/^\s*```/.test(line)){close();if(code){html+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';buf=[]}code=!code;continue}if(code){buf.push(line);continue}const heading=line.match(/^(#{1,6})\s+(.+)$/);const li=line.match(/^\s*([-*]|\d+\.)\s+(.+)$/);if(heading){close();const n=heading[1].length;html+='<h'+n+'>'+inline(heading[2])+'</h'+n+'>'}else if(li){const type=/\d/.test(li[1][0])?'ol':'ul';if(list!==type){close();html+='<'+type+'>';list=type}html+='<li>'+inline(li[2])+'</li>'}else if(!line.trim()){close()}else{close();html+='<p>'+inline(line)+'</p>'}}close();if(code)html+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';preview.innerHTML=html||'<p>Preview appears here.</p>'}input.addEventListener('input',render);$('save').onclick=()=>MDTools.download(new Blob([input.value],{type:'text/markdown;charset=utf-8'}),'notes.md');$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(input.value);$('status').textContent='Copied.'}catch(e){input.select();$('status').textContent='Select and copy manually.'}};$('clear').onclick=()=>{input.value='';render()};render()})();</script></body></html>
