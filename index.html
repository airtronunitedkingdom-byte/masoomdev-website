<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c3aed'/%3E%3Ctext x='32' y='44' font-size='37' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EM%3C/text%3E%3C/svg%3E">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#eef2ff;background:#090d19;font-synthesis:none}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:0 24px}.top{position:sticky;top:0;z-index:10;background:#0a0e1be8;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff14}.nav{display:flex;align-items:center;justify-content:space-between;min-height:76px;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:850;font-size:22px;letter-spacing:-.7px}.logo{width:41px;height:41px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#a855f7,#4f46e5);box-shadow:0 6px 26px #6d28d94a}.links{display:flex;align-items:center;gap:25px}.links a{font-size:14px;color:#aeb6cc}.links a:hover,.links a.active{color:#fff}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid #ffffff24;border-radius:13px;padding:13px 20px;background:#ffffff0a;color:white;font-weight:700}.btn:hover{background:#ffffff16}.btn.primary{background:linear-gradient(110deg,#8b5cf6,#5b55e9);border:0;box-shadow:0 12px 35px #6d28d940}.hero{position:relative;padding:115px 0 105px;overflow:hidden}.hero:before{content:"";position:absolute;width:700px;height:550px;right:-250px;top:-220px;background:radial-gradient(ellipse,#6d28d94d,transparent 65%);pointer-events:none}.eyebrow{display:inline-block;padding:9px 15px;border:1px solid #8b5cf64a;border-radius:100px;color:#c5b4ff;background:#8b5cf610;font-size:13px;font-weight:700}.hero h1{font-size:clamp(46px,7vw,82px);max-width:850px;letter-spacing:-3.8px;line-height:1.07;margin:27px 0}.gradient{background:linear-gradient(110deg,#c084fc,#818cf8,#67e8f9);background-clip:text;color:transparent}.lead{font-size:19px;color:#a8b3cc;line-height:1.8;max-width:650px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}.stats{display:flex;gap:34px;margin-top:70px;flex-wrap:wrap}.stat strong{display:block;font-size:22px}.stat span{font-size:13px;color:#8894af}.section{padding:75px 0}.section.alt{background:#101629}.sectionhead{margin-bottom:34px}.kicker{color:#b6a1ff;font-weight:800;letter-spacing:2px;font-size:12px;text-transform:uppercase}.section h2,.page h1{font-size:clamp(30px,4vw,45px);letter-spacing:-1.5px;margin:12px 0}.muted{color:#9ca8c1;line-height:1.75}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{padding:27px;border:1px solid #ffffff13;border-radius:22px;background:linear-gradient(145deg,#202640,#131a2d);transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-4px);border-color:#a78bfa66}.card h3{margin:19px 0 9px;font-size:21px}.card p{font-size:14px;line-height:1.75;color:#a8b2c9}.tile{display:grid;place-items:center;width:58px;height:58px;border-radius:17px;background:#8b5cf628;font-size:27px}.pill{display:inline-block;color:#b5a4ff;border:1px solid #8b5cf640;border-radius:50px;font-size:11px;font-weight:800;padding:7px 10px;margin-top:10px}.empty{border:1px dashed #ffffff30;border-radius:22px;padding:45px;text-align:center;background:#ffffff05}.empty h3{font-size:22px}.empty p{color:#9ca8c1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.feature{padding:27px;border:1px solid #ffffff12;background:#ffffff05;border-radius:19px}.feature h3{margin:0 0 10px}.cta{border:1px solid #8b5cf640;border-radius:28px;background:radial-gradient(ellipse at top right,#7c3aed4a,transparent 70%),#161b34;padding:50px;display:flex;align-items:center;justify-content:space-between;gap:25px}.cta h2{margin:0 0 10px}.footer{padding:36px 0;border-top:1px solid #ffffff15;color:#8792aa;font-size:13px}.footrow{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.footlinks{display:flex;gap:18px;flex-wrap:wrap}.page{padding:68px 0 110px;min-height:65vh}.page .intro{max-width:760px}.document{max-width:820px;background:#13192b;border:1px solid #ffffff14;padding:36px;border-radius:22px;margin-top:30px}.document h2{font-size:21px;margin-top:35px}.document p,.document li{color:#b1bad0;line-height:1.85}.document a{color:#bba6ff;text-decoration:underline}.note{padding:15px 18px;border-left:3px solid #a78bfa;background:#a78bfa12;border-radius:8px;color:#d3c8ed}.contact{display:inline-flex;align-items:center;gap:10px;font-weight:700;color:#c9baff}.hidden{display:none!important}.menu{display:none}.field{width:100%;background:#0c1121;border:1px solid #ffffff29;color:white;padding:14px 16px;border-radius:12px;margin:8px 0 18px}label{display:block;font-weight:700}.tiny{font-size:12px;color:#8d9ab5}.appicon{width:64px;height:64px;border-radius:16px;background:#282f49;display:grid;place-items:center;font-size:32px}
@media(max-width:760px){.links{display:none;position:absolute;left:0;right:0;top:75px;padding:22px 24px;background:#11182b;flex-direction:column;align-items:flex-start;border-bottom:1px solid #ffffff24}.links.open{display:flex}.menu{display:block;background:none;border:1px solid #ffffff24;color:white;border-radius:10px;padding:8px 12px}.hero{padding:76px 0}.hero h1{letter-spacing:-2px}.cards,.grid2{grid-template-columns:1fr}.cta{padding:30px;display:block}.cta .btn{margin-top:18px}.document{padding:23px}.stats{margin-top:45px}}
</style></head>
<body><header class="top"><div class="shell nav"><a class="brand" href="/" data-link><span class="logo">M</span>MasoomDev</a><nav id="nav" class="links" aria-label="Main navigation"><a href="/" data-link>Home</a><a href="/apps" data-link>Our Apps</a><a href="/about" data-link>About</a><a href="/privacy" data-link>Privacy</a><a href="/support" data-link>Support</a></nav><button class="menu" id="menu" aria-label="Toggle menu" aria-expanded="false">☰</button></div></header>
<div id="app"></div><footer class="footer"><div class="shell footrow"><div><strong style="color:#eee">MasoomDev</strong> · Games, Tools & Everyday Apps<br><span>© <span id="year"></span> MasoomDev. All rights reserved.</span></div><div class="footlinks"><a href="/apps" data-link>Apps</a><a href="/privacy" data-link>Privacy Policy</a><a href="/terms" data-link>Terms</a><a href="/support" data-link>Support</a></div></div></footer>
<script>
const EMAIL='airtron68@gmail.com';
// Add real published apps here. Do not add unverified store links or privacy statements.
// Example: {slug:'my-puzzle',name:'My Puzzle',category:'Brain Games',icon:'🧩',description:'A fun puzzle game.',playUrl:'https://play.google.com/store/apps/details?id=YOUR.PACKAGE',privacy:{localStorage:true,ads:false,analytics:false,crashReporting:false,otherData:'None known'} }
const APPS=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mail='<a class="contact" href="mailto:'+EMAIL+'">✉ '+EMAIL+'</a>';
const button=(url,text,primary=false)=>'<a class="btn '+(primary?'primary':'')+'" href="'+url+'" '+(url.startsWith('http')?'target="_blank" rel="noopener noreferrer"':'data-link')+'>'+text+'</a>';
const heading=(tag,title,desc)=>'<div class="sectionhead"><span class="kicker">'+tag+'</span><h2>'+title+'</h2><p class="muted">'+desc+'</p></div>';
const card=(icon,title,desc)=>'<div class="card"><span class="tile">'+icon+'</span><h3>'+title+'</h3><p>'+desc+'</p></div>';
const appCard=a=>'<article class="card"><div class="appicon">'+esc(a.icon||'📱')+'</div><span class="pill">'+esc(a.category||'App')+'</span><h3>'+esc(a.name)+'</h3><p>'+esc(a.description||'')+'</p><div class="actions">'+button('/apps/'+encodeURIComponent(a.slug),'View details')+(a.playUrl?button(a.playUrl,'Google Play ↗'):'')+'</div></article>';
const appList=()=>APPS.length?'<div class="cards">'+APPS.map(appCard).join('')+'</div>':'<div class="empty"><div style="font-size:38px">🚀</div><h3>Our apps are on the way</h3><p>We are preparing our first releases. Check back soon for new games and useful tools.</p></div>';
const home=()=>'<section class="hero"><div class="shell"><span class="eyebrow">✦ Independent App Developer</span><h1>Little apps.<br><span class="gradient">Big everyday joy.</span></h1><p class="lead">Welcome to MasoomDev. We create enjoyable brain games, thoughtful puzzles and simple everyday tools designed to make your day a little better.</p><div class="actions">'+button('/apps','Explore Our Apps →',true)+button('/about','Meet MasoomDev')+'</div><div class="stats"><div class="stat"><strong>🧩</strong><span>Brain & Puzzle Games</span></div><div class="stat"><strong>🛠️</strong><span>Useful Daily Tools</span></div><div class="stat"><strong>✨</strong><span>Simple Experiences</span></div></div></div></section><section class="section alt"><div class="shell">'+heading('WHAT WE CREATE','Made for everyday moments','From a quick brain challenge to a practical utility, our apps focus on straightforward experiences.')+'<div class="cards">'+card('🧠','Brain Games','Engaging challenges that encourage problem-solving and a little creative thinking.')+card('🧩','Puzzles & Casual Games','Accessible games designed for quick breaks and relaxed play.')+card('🧮','Tools & Utilities','Handy calculators, counters and simple tools for everyday tasks.')+'</div></div></section><section class="section"><div class="shell">'+heading('OUR APPS','Explore the collection','Discover our published apps as they become available.')+appList()+'<div style="margin-top:26px">'+button('/apps','See all apps →')+'</div></div></section><section class="section alt"><div class="shell"><div class="cta"><div><span class="kicker">HERE TO HELP</span><h2>Questions or feedback?</h2><p class="muted">Get in touch for app support, suggestions or privacy enquiries.</p></div>'+button('/support','Contact Support →',true)+'</div></div></section>';
const appsPage=()=>'<main class="page shell"><span class="kicker">MASOOMDEV COLLECTION</span><h1>Our Apps</h1><p class="muted intro">Brain games, puzzles and practical everyday utilities. Browse our releases and find app-specific information.</p><div style="margin-top:35px">'+appList()+'</div></main>';
const about=()=>'<main class="page shell"><span class="kicker">WHO WE ARE</span><h1>About MasoomDev</h1><p class="muted intro">MasoomDev is an independent app developer focused on creating simple, enjoyable and useful mobile experiences.</p><div class="grid2" style="margin-top:35px"><div class="feature"><h3>🎮 Play</h3><p class="muted">Brain games and puzzles for fun, casual challenges.</p></div><div class="feature"><h3>⚡ Make life easier</h3><p class="muted">Everyday utilities that prioritise clarity and ease of use.</p></div><div class="feature"><h3>🔒 Respect users</h3><p class="muted">We aim to explain how each app handles information and provide clear support channels.</p></div><div class="feature"><h3>💬 Keep improving</h3><p class="muted">Feedback helps guide improvements and future releases.</p></div></div></main>';
const privacy=()=>'<main class="page shell"><span class="kicker">TRANSPARENCY</span><h1>Privacy Policy</h1><p class="muted intro">General information about this website. Each published app may have its own policy explaining its actual data practices.</p><div class="document"><p class="note"><strong>Important:</strong> This general website policy is not a substitute for an app-specific privacy policy. Data collection by advertising, analytics, crash-reporting or other SDKs must be disclosed accurately for each app.</p><h2>1. Who we are</h2><p>MasoomDev operates this informational developer website. Contact: '+mail+'.</p><h2>2. Information you provide</h2><p>This website does not offer account registration or login. If you email us, we receive the information you choose to send, including your email address and message, so we can respond to your enquiry.</p><h2>3. Website hosting and technical data</h2><p>This website is intended to be hosted on Vercel. Hosting infrastructure may process technical request information, such as IP addresses and request metadata, for delivery, reliability and security. The exact retention and processing depend on the deployed hosting configuration.</p><h2>4. Cookies and analytics</h2><p>The website code does not intentionally set tracking cookies or include advertising or analytics scripts. If these services are added later, this policy must be updated.</p><h2>5. Mobile apps</h2><p>Our apps may differ in how they store or process data. Login-free does not necessarily mean no data processing. Please consult the specific app policy linked from its app page before relying on any app-level privacy statement.</p><h2>6. Sharing and retention</h2><p>Support emails are used to handle enquiries and may be processed by our email provider. We retain correspondence only as needed for support, legitimate business purposes and applicable obligations.</p><h2>7. Your choices</h2><p>You may contact us to ask about personal information associated with your support correspondence or request its deletion, subject to applicable legal requirements.</p><h2>8. Children</h2><p>Individual apps may have different intended audiences. App-specific policies and store disclosures should describe any child-directed functionality or third-party services accurately.</p><h2>9. Updates</h2><p>We may update this policy as the website and our apps evolve. Last updated: 14 October 2026.</p><h2>10. Contact</h2><p>'+mail+'</p></div></main>';
const terms=()=>'<main class="page shell"><span class="kicker">LEGAL</span><h1>Terms & Conditions</h1><p class="muted intro">General terms for using the MasoomDev website.</p><div class="document"><h2>Website information</h2><p>Content on this website is provided for general information about MasoomDev and its apps. We aim to keep it accurate but may update it from time to time.</p><h2>App availability</h2><p>App features, availability and compatibility may change. App distribution and purchases, if any, are subject to the applicable app store terms.</p><h2>Intellectual property</h2><p>Unless otherwise indicated, website content and branding belong to their respective owners. Do not reproduce protected materials without permission.</p><h2>External links</h2><p>Links to Google Play and other external websites are subject to those services’ own terms and privacy practices.</p><h2>Liability</h2><p>Nothing in these terms excludes rights or protections that cannot lawfully be excluded. For support, contact '+mail+'.</p><h2>Updates</h2><p>These terms may be revised. Last updated: 14 October 2026.</p></div></main>';
const support=()=>'<main class="page shell"><span class="kicker">WE ARE HERE TO HELP</span><h1>Support & Contact</h1><p class="muted intro">Have a question, found a bug, or want to share feedback? Contact MasoomDev directly.</p><div class="grid2" style="margin-top:35px"><div class="card"><span class="tile">✉️</span><h3>Email Support</h3><p>For app issues, feedback, accessibility or general questions.</p>'+mail+'</div><div class="card"><span class="tile">🔐</span><h3>Privacy & Data Requests</h3><p>For questions about privacy, data access or deletion, email us with the relevant app name. Please do not send passwords or sensitive documents.</p>'+mail+'</div></div><div class="document"><h2>How to get help faster</h2><p>Please include the app name, your device model, Android version, and a short description of the problem. Screenshots are optional; avoid including sensitive information.</p><h2>Data deletion requests</h2><p>Our website does not provide user accounts. If an app stores information locally, you may be able to remove it using that app’s settings or Android’s app data controls. Contact us for app-specific assistance. We will not claim to delete data held by a third party unless we can actually do so.</p></div></main>';
const appDetail=a=>'<main class="page shell"><a href="/apps" data-link class="muted">← All apps</a><div style="display:flex;gap:18px;align-items:center;margin-top:30px"><div class="appicon">'+esc(a.icon||'📱')+'</div><div><span class="kicker">'+esc(a.category||'App')+'</span><h1 style="margin:5px 0">'+esc(a.name)+'</h1></div></div><p class="muted intro">'+esc(a.description||'')+'</p><div class="actions">'+(a.playUrl?button(a.playUrl,'Get it on Google Play ↗',true):'')+button('/apps/'+encodeURIComponent(a.slug)+'/privacy','App Privacy Policy')+button('/support','Get Support')+'</div></main>';
const appPrivacy=a=>{const p=a.privacy;if(!p)return '<main class="page shell"><h1>Privacy information pending</h1><p class="muted">An app-specific privacy policy has not yet been verified for '+esc(a.name)+'. Contact '+mail+' for information before using the app.</p></main>';return '<main class="page shell"><span class="kicker">APP PRIVACY</span><h1>'+esc(a.name)+' — Privacy Policy</h1><div class="document"><p>This policy describes the data practices of '+esc(a.name)+' based on the developer-maintained app configuration. It must be reviewed against the released app and all integrated SDKs.</p><h2>Accounts</h2><p>No account registration is required unless explicitly stated in the app.</p><h2>On-device storage</h2><p>'+ (p.localStorage?'This app may store preferences or progress on your device.':'No app-specific local storage has been declared.')+'</p><h2>Third-party services</h2><p>Advertising: '+(p.ads?'Used':'Not declared')+'. Analytics: '+(p.analytics?'Used':'Not declared')+'. Crash reporting: '+(p.crashReporting?'Used':'Not declared')+'.</p><h2>Additional information</h2><p>'+esc(p.otherData||'Contact the developer for details.')+'</p><h2>Contact and requests</h2><p>'+mail+'</p></div></main>'};
function render(){let path=decodeURI(location.pathname).replace(/\/+$/,'')||'/';let parts=path.split('/').filter(Boolean);let a=APPS.find(x=>x.slug===parts[1]);let content=path==='/'?home():path==='/apps'?appsPage():path==='/about'?about():path==='/privacy'?privacy():path==='/terms'?terms():path==='/support'||path==='/data-deletion'?support():parts[0]==='apps'&&a&&parts.length===2?appDetail(a):parts[0]==='apps'&&a&&parts[2]==='privacy'?appPrivacy(a):'<main class="page shell"><h1>Page not found</h1><p class="muted">We could not find that page.</p>'+button('/','Go home',true)+'</main>';$('#app').innerHTML=content;document.title=(path==='/'?'MasoomDev — Games, Tools & Everyday Apps':(a?a.name:parts[0]||'MasoomDev')+' | MasoomDev');document.querySelectorAll('.links a').forEach(el=>el.classList.toggle('active',el.getAttribute('href')===path));$('#nav').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');}
document.addEventListener('click',e=>{const a=e.target.closest('a[data-link]');if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();history.pushState(null,'',a.getAttribute('href'));render();window.scrollTo(0,0)});window.addEventListener('popstate',render);$('#menu').addEventListener('click',()=>{let open=$('#nav').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(open))});$('#year').textContent=new Date().getFullYear();render();
</script></body></html>
